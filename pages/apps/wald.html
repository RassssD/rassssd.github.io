<div class="wrap">
  <header>
    <h1>The Wald Test</h1>
    <p class="sub">Testing several restrictions at once: why a joint test is not two t-tests, where the ellipses come from, and what changes when the restriction is nonlinear. Use the buttons or the ← → keys.</p>
  </header>
  <div class="topbar">
    <nav class="steps" id="nav" aria-label="Steps"></nav>
    <div class="pager"><button id="prev">← Previous</button><button id="next" class="primary">Next →</button></div>
  </div>
  <div class="grid" id="grid">
    <section class="panel">
      <div class="figs" id="fig"></div>
      <div class="legend" id="legend"></div>
      <p class="hint" id="hint"></p>
    </section>
    <section class="side">
      <div>

      </div>

      <div class="controls">
        <div class="ctl" id="c-n"><label for="n">n firms</label><input type="range" id="n" min="5" max="400" step="5"><output id="no"></output></div>
        <div class="ctl" id="c-r"><label for="r">corr(K, L)</label><input type="range" id="r" min="-0.9" max="0.9" step="0.05"><output id="ro"></output></div>
        <div class="ctl" id="c-sdl"><label for="sdl">sd(log L)</label><input type="range" id="sdl" min="0.5" max="1.5" step="0.05"><output id="sdlo"></output></div>
        <div class="ctl" id="c-cbox"><label for="cbox">box cut-off</label><input type="range" id="cbox" min="1.8" max="3" step="0.01"><output id="cboxo"></output></div>
        <div class="ctl" id="c-m"><label for="m">whiten</label><input type="range" id="m" min="0" max="1" step="0.01"><output id="mo"></output></div>
        <div class="ctl" id="c-alpha"><label for="alpha">α</label><input type="range" id="alpha" min="0.01" max="0.2" step="0.01"><output id="alphao"></output></div>
        <div class="row" id="c-row">
          <button id="new">New sample</button>

          <button id="all">Test every β₀</button>

<script>
(function(){
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
// log Y = β₀ + β₁ log K + β₂ log L + u. Inputs have SDs SDK and st.sdl and correlation r; the error has SD SIG
const SDK=1,SIG=.8,NSIM=4000;
const B0=[.3,.7],TRUE=[.3,.7],TNL=[2,.5];
// The two estimates of the "right size, wrong rejections" step, in t-units: both a bit high; one up, one down
const WRONG=[['A',[1.5,1.5]],['B',[2.1,-2.1]]];
const DEF={n:100,r:.6,alpha:.05,m:0,cbox:1.96,seed:4,bB:[.45,.88],bC:[.45,.78],bD:[1.6,1],probe:[.3,.7],sdl:1};
// Per-part sample settings, applied on entering a part. Part E uses a smaller, noisier sample so the curvature of the null matters
const PS={E:{n:10,r:.3,sdl:.8}};
const fresh=()=>JSON.parse(JSON.stringify(DEF));
const st={step:0,...fresh(),reveal:false,k:10};
const T=String.raw;

const RECIPE=[
 T`State \(H_0\) as \(q\) restrictions: \(R\beta=r\), or \(g(\beta)=0\).`,
 T`Compute the discrepancy \(d=R\hat\beta-r\) and its variance \(R\hat VR'\).`,
 T`Form \(W=d'(R\hat VR')^{-1}d\). If \(H_0\) is true, \(W\sim\chi^2_q\).`,
 T`Choose \(\alpha\). It fixes the critical value \(c\) from \(\chi^2_q\).`,
 T`Reject \(H_0\) if \(W>c\), equivalently if \(p<\alpha\).`];
const recipe=on=>`<ol class="recipe">${RECIPE.map((t,i)=>`<li class="${on.includes(i)?'on':''}">${t}</li>`).join('')}</ol>`;

const steps=[
 {id:'one',part:'A',t:'One restriction you already know',fig:[1,1],ctl:['n','new'],hint:'Draw a new sample: t moves, and W = t² moves with it. Both red tails on top fold into the one red tail below.',
  text:T`<p>A Cobb–Douglas production function, estimated by OLS on \(n\) firms:</p><p class="eq">\(\log Y=\beta_0+\beta_1\log K+\beta_2\log L+u\)</p><p>\(\beta_1\) and \(\beta_2\) are the output elasticities of capital and labour. Start with one of them: is \(\beta_1=0.3\)? That is a t-test, as in <a href="hypothesis-testing.html">the hypothesis-testing app</a>.</p><p class="key">Square the t-statistic: \(W=t^2\). Rejecting when \(|t|>1.96\) is rejecting when \(W>1.96^2=3.84\). <strong>Same test, new scale.</strong> \(W\) follows a \(\chi^2_1\) distribution, the square of a standard normal.</p><p>The squared version is the one that extends to several restrictions at once.</p>`},
 {id:'cloud',part:'B',t:'Two coefficients, correlated estimates',fig:[1],ctl:['r','n'],set:{r:.85},hint:'Move the correlation between log K and log L: the cloud tilts, and the narrow strip swaps from the total to the split.',
  text:T`<p>Now two coefficients at once. Each sample gives one estimate \((\hat\beta_1,\hat\beta_2)\); the dots are estimates from many samples around the true \((0.3,\,0.7)\).</p><p>The estimates are correlated. When firms with more capital also have more labour, every sample pins down the total \(\beta_1+\beta_2\) well but the split poorly, so the estimates spread out along the blue line: a sample that overstates \(\beta_1\) tends to understate \(\beta_2\). Why this happens is worked through in <a href="correlated-estimates.html">the correlated-estimates app</a>.</p><p class="key">A test should use this. <strong>The noise is much larger along the blue line than across it</strong>, so an estimate some distance from \(H_0\) is ordinary if it lies along the line and surprising if it lies across it. A joint test that knows the correlation can tell the two apart; two separate t-tests cannot.</p><p>With substitutes (correlation below 0) the cloud tilts the other way; with two regressors, \(\text{corr}(\hat\beta_1,\hat\beta_2)=-\text{corr}(\log K,\log L)\). The rest of this app builds a test that uses the correlation: the Wald test.</p>`},
 {id:'joint',part:'C',t:'A joint null: β₁ = 0.3 and β₂ = 0.7',fig:[1],ctl:[],drag:'bB',hint:'Click or drag in the plane to move your estimate.',
  text:T`<p>Two points in the plane. The <strong>orange point is the null hypothesis</strong>, the textbook shares of capital and labour:</p><p class="eq">\(H_0:\ \beta_1=0.3\ \text{and}\ \beta_2=0.7\)</p><p>The <strong>blue point is your estimate</strong> from one sample, \((\hat\beta_1,\hat\beta_2)\). It starts at (0.45, 0.88). Click or drag in the plane to move it.</p><p>\(H_0\) makes two claims at once, so it imposes two restrictions: \(q=2\). The <strong>discrepancy</strong> is the arrow from the null to the estimate, \(d=\hat\beta-(0.3,\,0.7)'\).</p><p class="key">The question: <strong>is the arrow long compared with the noise?</strong> Rejecting says at least one of the two values is wrong. It does not say which.</p>${recipe([0,1])}<p>In the recipe's notation, \(R=I_2\) and \(r=(0.3,\,0.7)'\).</p>`},
 {id:'twoq',part:'C',t:'Two questions: is the total right, is the split right?',fig:[1],ctl:['r'],set:{sdl:1},drag:'bB',hint:'Click or drag to move your estimate: each segment is one question, measured in its own standard errors.',
  text:T`<p>The joint null asks two questions at once: is the total \(\beta_1+\beta_2\) right, and is the split \(\beta_1-\beta_2\) right? Each has its own noise, so measure each error against its own standard error:</p><p class="eq">\(t_{\text{total}}=\frac{(\hat\beta_1+\hat\beta_2)-1}{\text{se}_{\text{total}}},\qquad t_{\text{split}}=\frac{(\hat\beta_1-\hat\beta_2)+0.4}{\text{se}_{\text{split}}}\)</p><p class="key">When log K and log L have the same spread, these two are uncorrelated, and <strong>the Wald statistic is just \(W=t_{\text{total}}^2+t_{\text{split}}^2\)</strong>. Your estimate passes both separate t-tests on \(\beta_1\) and \(\beta_2\), but its total is 3.7 standard errors too high: \(W\approx13.6\).</p><p>So the joint test is two t-tests after all, on the right combinations: the ones whose estimates are uncorrelated. The next steps show what goes wrong with t-tests on \(\beta_1\) and \(\beta_2\) themselves, then build the general version, which works whatever the spreads.</p>`},
 {id:'twot',part:'C',t:'Why not two t-tests?',fig:[1],ctl:['new','ten','more','r'],btnFirst:true,newLabel:'Draw an estimate',tenLabel:'Draw 10',moreLabel:'Draw 100',hint:'Every dot is drawn with H₀ true. Set the correlation to 0 to get 9.75%; raise it and the corners fill up.',
  text:T`<p>A shortcut: test \(\beta_1=0.3\) and \(\beta_2=0.7\) separately, each with its own t-test, and reject \(H_0\) if either rejects.</p><p>The red bands are where the first test rejects: \(\hat\beta_1\) too far left or right. The orange bands are where the second rejects: \(\hat\beta_2\) too high or too low. Every dot is an estimate drawn <strong>with \(H_0\) true</strong>, so a 5% test should reject 5% of them.</p><p class="eq">\(P(R)=P(R_1)+P(R_2)-P(R_1\cap R_2)\)</p><p class="key">Each band catches 5% of the draws. The corners lie in both bands, so they must not be counted twice. <strong>With independent estimates, 5% + 5% − 0.25% = 9.75%</strong>: almost double the size we asked for.</p><p>Correlated estimates are more often extreme together, so more draws land in the corners, the overlap grows, and the rate falls back towards 5%. At a correlation of ±1 the two tests would be the same test asked twice, and the rate would be exactly 5%.</p><p>So the rule is closer to the right size when the estimates are strongly correlated. That does not make it a good test: @{wrong} shows what it gets wrong. A better region would follow the shape of the cloud. The next step builds it.</p>`},
 {id:'ruler',part:'C',t:'Where the ellipses come from',fig:[1],ctl:['r'],drag:'bB',hint:'Click or drag to move your estimate. Along an ellipse W stays put; across the ellipses W climbs.',
  text:T`<p>Look at the cloud of estimates drawn with \(H_0\) true. It is densest at the null and thins out in rings that share the cloud's shape: <strong>ellipses</strong>.</p>${recipe([2])}<p>Each ring is a set of points with the same value of the Wald statistic,</p><p class="eq">\(W=d'\hat V^{-1}d\)</p><p>which measures the arrow with the noise as its unit. With one coefficient it is \(d^2/\text{se}^2=t^2\). With two, \(\hat V^{-1}\) also allows for the correlation.</p><p class="key">A step along the long, noisy direction raises \(W\) slowly; a step across it, quickly. <strong>The ring at \(W=5.99\) holds 95% of the cloud.</strong></p><p>This is the familiar critical value, in two dimensions. With one coefficient, a 5% test rejects when \(|t|>1.96\): two cut-offs on a line, with the rejection region in the two tails. With two, the cut-off becomes a curve. <strong>The 95% ellipse plays the role of \(\pm1.96\)</strong>: inside it, do not reject; outside it is the rejection region, which holds 5% of the estimates when \(H_0\) is true.</p><p>Adding up \(t_1^2+t_2^2\) would ignore the correlation. The readout shows how far off that is.</p>`},
 {id:'white',part:'C',t:'Take the noise out: whitening',fig:[1],ctl:['m','r'],set:{m:0},drag:'bB',hint:'Slide from the β plane to the whitened plane. The dots are draws with H₀ true; the grid lines are lines of constant β₁ and β₂.',
  text:T`<p>Change coordinates so that the noise is the same size in every direction and uncorrelated:</p><p class="eq">\(z=\hat V^{-1/2}(\hat\beta-r)\)</p><p>The slider bends the plane into these coordinates. Everything moves with it: the grid, the cloud, the ellipses and your estimate.</p><p class="key">In the whitened plane <strong>the ellipses are circles and \(W\) is the ordinary squared length of the arrow</strong>: \(W=z_1^2+z_2^2\).</p><p>If \(H_0\) is true, \(z_1\) and \(z_2\) are independent standard normals, and a sum of \(q\) squared independent standard normals is exactly what a \(\chi^2_q\) variable is.</p>`},
 {id:'chi',part:'C',t:'W against χ²₂',fig:[1,1],ctl:['alpha'],drag:'bB',hint:'Drag the blue point to try other estimates, or move α. The dashed ellipse runs through your estimate, at level W.',
  text:T`${recipe([3,4])}<p><strong>Drag the blue point to pick a different estimate</strong>: each position is an estimate a sample might have given you. The arrow from \(H_0\) to it is its discrepancy \(d\), and the curve below shows where its \(W\) falls.</p><p>Each cut-off on the \(\chi^2_2\) curve is one ellipse in the plane. With \(\alpha=0.05\) the cut-off is \(c=5.99\), and the shaded 95% ellipse is where the test does not reject.</p><p>The p-value is the share of the curve beyond your \(W\): the chance, if \(H_0\) is true, of an estimate on a larger ellipse than yours.</p><p class="key">Reject \(H_0\) when \(W>c\): <strong>when your estimate lies outside the \(1-\alpha\) ellipse</strong> around the null.</p><p>Software usually reports \(F=W/q\) instead, compared with an \(F(q,\,n-k)\) distribution, which allows for \(\sigma\) being estimated. In large samples the two give the same answer.</p>`},
 {id:'compare',part:'C',t:'Widen the box, or use the ellipse?',fig:[1],ctl:['cbox','r','sdl','new','ten','more'],set:{cbox:2.24},drag:'bB',newLabel:'Draw an estimate',tenLabel:'Draw 10',moreLabel:'Draw 100',hint:'Move the cut-off and the correlation: the readout gives each rule’s long-run rate. Purple dots: only the ellipse rejects. Dark dots: only the box rejects.',
  text:T`<p>One repair for the two t-tests: make each stricter, so that together they reject 5%. With independent estimates \(|t|>2.24\) does it: 2.5% + 2.5% − 0.06% ≈ 5%. But <strong>only at that correlation</strong>. Move the correlation and the overlap changes, so the same cut-off no longer gives 5% (see the readout).</p><p>Now put the widened box next to the 95% ellipse.</p><p class="key">Even at the right size, the box has the wrong shape. It keeps corners where draws almost never land and cuts into the long tips of the cloud. <strong>The two rules disagree on many samples</strong>, more so as the correlation grows.</p><p>Press Reset to put your estimate back where it started: inside the box, outside the ellipse. Neither t-test rejects, but the joint test does. Both coefficients are a little high <em>together</em>, which the negative correlation makes unlikely. The next step walks through this, and the opposite mistake, point by point.</p><p>Of all regions holding 95% of the draws, the ellipse is the smallest: it leaves out the least likely estimates first.</p>`},
 {id:'wrong',part:'C',t:'Right size, wrong rejections',fig:[1],ctl:['r'],set:{r:.85},hint:'Move the correlation between 0 and 0.9: the box’s verdicts on A and B never change, the ellipse’s do.',
  text:T`<p>As @{twot} showed, correlation shrinks the two-t-test rule's size problem: the two tests overlap, so their false alarms are largely the same draws. At this correlation the rule's false-alarm rate (in the readout) is already much closer to 5% than the 9.75% at zero correlation.</p><p>That only says <em>how often</em> it rejects. Look at <em>which</em> estimates it rejects, with the original cut-off of 1.96 and a correlation of 0.85 between the inputs:</p><ul><li><strong>A: both coefficients a bit high</strong>, \(t=(1.5,\,1.5)\). Neither t-test rejects, so the box keeps \(H_0\). But A moves the <em>sum</em>, the direction the firms pin down precisely (@{cloud}). The noise almost never pushes both estimates up together. A lies far outside the ellipse, with \(W\) around 30.</li><li><strong>B: one high, one low</strong>, \(t=(2.1,\,-2.1)\). Both t-tests reject. But B moves only the <em>split</em>, which the data barely see. That is exactly how the noise moves, along the long axis of the cloud. B lies inside the ellipse, with \(W\) under 5.99.</li></ul><p class="key">The box gets the count roughly right but <strong>rejects the wrong estimates</strong>. It keeps A, which is very unlikely if \(H_0\) is true, and rejects B, which is ordinary. The stronger the correlation, the more it gets wrong.</p><p>Move the correlation to 0: the cloud turns round, and the two rules agree on both points. With a negative correlation the cloud tilts the other way (@{cloud}), and the mirror images of A and B become the problem cases.</p>`},
 {id:'witness',part:'C',t:'Same t-statistics, different evidence',fig:[1],ctl:['wa','wb','wc','r'],btnFirst:true,set:{r:0},hint:'Switch the correlation of the estimates with the buttons or the slider. A and B stay put in t-units; their W changes.',
  text:T`<p>Why does the correlation change the verdict? Take the two estimates from the last step, <strong>A</strong> (both coefficients a bit high, \(t=(1.5,\,1.5)\)) and <strong>B</strong> (one high and one low, \(t=(2.1,\,-2.1)\)), and change how the estimates are correlated.</p><ul><li><strong>Uncorrelated.</strong> \(W=t_1^2+t_2^2\): 4.5 for A, 8.8 for B.</li><li><strong>Negatively correlated</strong> (complements, our firms). The noise usually pushes the two estimates in opposite directions. So A, both high, is unusual: \(W\approx30\). B is what the noise usually does: \(W\) under 5.99.</li><li><strong>Positively correlated</strong> (substitutes). The noise usually pushes both the same way. Now A is ordinary (\(W=2.4\)) and B unusual (\(W\approx59\)).</li></ul><p class="key">The same two t-statistics can be strong or weak evidence against \(H_0\), depending on what the noise usually does. <strong>\(\hat V^{-1}\) accounts for that; \(t_1^2+t_2^2\) does not.</strong></p><p>An analogy: two witnesses at a trial. If they are strangers, their agreement corroborates. If they come from opposite camps, agreement is striking and disagreement expected. If they rehearsed together, agreement is cheap and disagreement alarming.</p>`},
 {id:'region',part:'C',t:'Confidence region: every β₀ you cannot reject',fig:[1],ctl:['alpha','rand','all'],set:{r:.6},drag:'probe',hint:'Click or drag anywhere in the plane: the triangle follows, and each spot it visits is tested and marked.',
  text:T`<p>Now keep the estimate fixed and move the null instead. The orange triangle is a candidate null, \(\beta_0\). <strong>Click or drag anywhere in the plane</strong> to move it: each spot it visits is tested and marked purple if the test does not reject it, red if it does. Or let the buttons test pairs for you.</p><p class="key">The survivors form an ellipse around \(\hat\beta\). <strong>The 95% confidence region contains all pairs \((\beta_1,\beta_2)\) we cannot reject.</strong> It has the shape of the acceptance region, centred on the estimate instead of the null.</p><p>It is not the box formed by the two separate confidence intervals (dashed). A pair can sit inside both intervals and still be rejected jointly. The triangle starts at (0.3, 0.7), the null from @{joint}: inside both intervals, outside the region.</p>`},
 {id:'line0',part:'D',t:'A weaker null: constant returns',fig:[1],ctl:[],drag:'bC',hint:'Click or drag to move your estimate. The dashed line through it collects the estimates with the same sum.',
  text:T`<p>So far the null was a single point. A weaker question: does production have <strong>constant returns to scale</strong>?</p><p class="eq">\(H_0:\beta_1+\beta_2=1\)</p><p>This null is a whole line: every pair on it, (0.3, 0.7) among them, satisfies \(H_0\). It is <strong>one restriction</strong> on two coefficients, so \(q=1\).</p><p class="key">The discrepancy is now one number: how far the estimated sum is from 1, \(d=\hat\beta_1+\hat\beta_2-1\). Every estimate on the dashed line through yours has the same \(d\).</p><p>The question is again whether \(d\) is large compared with its noise. The next step works out that noise.</p>`},
 {id:'line',part:'D',t:'The noise in the sum uses the covariance',fig:[1],ctl:['r','sdl'],drag:'bC',hint:'Move the correlation: the strip the test does not reject narrows or widens. Click or drag to move your estimate in and out of it.',
  text:T`${recipe([0,1,2])}<p>To judge \(d=\hat\beta_1+\hat\beta_2-1\) we need its standard error. In the recipe's notation \(R=[1\;\;1]\) and \(r=1\), so its variance is</p><p class="eq">\(R\hat VR'=\text{se}_1^2+\text{se}_2^2+2\,\text{cov}(\hat\beta_1,\hat\beta_2)\)</p><p class="key">So \(W=d^2/R\hat VR'\) is the squared t-statistic for the sum, compared with \(\chi^2_1\). <strong>\(q\) counts restrictions, not coefficients.</strong></p><p>The shaded strip is where the test does not reject: sums within \(1.96\) standard errors of 1. The sum is the direction the firms pin down well (@{cloud}): when the inputs move together, the cloud lies along the line, the sum is precise, and the strip is narrow.</p><p>Leave out the covariance and you get the dotted strip instead, which is too wide here: the test then misses a sum that is clearly above 1.</p>`},
 {id:'touch',part:'D',t:'W is the distance to the line',fig:[1],ctl:['m','r','sdl'],set:{m:0,sdl:.7},drag:'bC',hint:'Drag your estimate, then slide to the whitened plane. Set sd(log L) to 1: the two points meet.',
  text:T`<p>\(W\) is also the smallest stretched distance from \(\hat\beta\) to any point of the null. Grow an ellipse around \(\hat\beta\) until it touches the line: its level is \(W\).</p><p>The touching point is generally not the nearest point by ordinary distance (grey). They coincide only when the ellipse's axes run along and across the line, as they do when log K and log L have the same spread; this step starts at sd(log L) = 0.7 to pull them apart.</p><p class="key">Bend the plane into whitened coordinates: <strong>the arrow meets the line at a right angle</strong>, and \(W\) is its squared length.</p><p>The joint null works the same way. There the null was a single point, so the arrow ran straight to it.</p>`},
 {id:'curve',part:'E',view:'nl',t:'A curved null',fig:[1],ctl:[],drag:'bD',hint:'Click or drag to move your estimate across the grey curves: g changes from one to the next.',
  text:T`<p>Leave the production function for a restriction that is a curve:</p><p class="eq">\(H_0:\ g(\beta)=\beta_1\beta_2-1=0\)</p><p>The discrepancy is still how far the estimate is from satisfying \(H_0\): \(d=g(\hat\beta)\). It is 0 on the orange curve. The grey curves are where \(g\) takes other values, and your estimate sits on the blue one.</p><p class="key">To turn \(d\) into a test we need its standard error. With a linear restriction that was \(\sqrt{R\hat VR'}\). <strong>A curve has no single \(R\)</strong>: how fast \(g\) changes depends on where you are.</p>`},
 {id:'tangent',part:'E',view:'nl',t:'Linearise at the estimate',fig:[1],ctl:[],drag:'bD',hint:'Click or drag to move your estimate: the arrow and the tangent move with it.',
  text:T`<p>The <strong>delta method</strong>: near the estimate, replace \(g\) by its tangent approximation,</p><p class="eq">\(g(\beta)\approx g(\hat\beta)+G\,(\beta-\hat\beta)\)</p><p>The gradient \(G=(\hat\beta_2,\,\hat\beta_1)\) is the black arrow. It points where \(g\) rises fastest, at right angles to the blue curve, and the black line is the blue curve's tangent.</p><p class="key">Locally, \(g\) is linear with \(G\) playing the role of \(R\). So <strong>\(\text{Var}(g(\hat\beta))\approx G\hat VG'\)</strong>, the same formula as before.</p>`},
 {id:'linnull',part:'E',view:'nl',t:'The linearised null',fig:[1],ctl:[],drag:'bD',hint:'Click or drag to move your estimate: the green line and the ellipse move with it.',
  text:T`<p>Where does the tangent approximation say \(g=0\)? On a line parallel to the tangent, shifted by \(g(\hat\beta)\): the green <strong>linearised null</strong>. Near the estimate it follows the orange curve.</p><p class="key">From here it is a linear test: <strong>\(W=g(\hat\beta)^2/(G\hat VG')\)</strong>, compared with \(\chi^2_1\). Geometrically, the ellipse around \(\hat\beta\) grows until it touches the green line.</p>`},
 {id:'far',part:'E',view:'nl',t:'When the tangent is a poor stand-in',fig:[1],ctl:[],drag:'bD',hint:'Drag the estimate towards the lower left, where the curve bends sharply.',
  text:T`<p>\(W\) measures the distance to the green line, not to the orange curve. Near the curve the two are close. Far from it, or where the curve bends sharply, they part.</p><p>The dotted ellipse grows until it touches the curve itself. With a normal \(\hat\beta\) and known \(\hat V\), its level is the likelihood ratio statistic: the distance to the null as it really is.</p><p class="key">The Wald test only uses what it can see at \(\hat\beta\): <strong>the estimate and the slope of \(g\) there</strong>. That makes it easy to compute, and approximate.</p>`},
 {id:'inv',part:'E',view:'nl',t:'Same hypothesis, written another way',fig:[1],ctl:[],set:{bD:[1.9,1.1]},drag:'bD',hint:'Click or drag to move your estimate: the two linearised nulls, and the two W, disagree almost everywhere.',
  text:T`<p>The same null can be written as</p><p class="eq">\(g_A(\beta)=\beta_1\beta_2-1=0\quad\text{or}\quad g_B(\beta)=\beta_1-1/\beta_2=0\)</p><p>Both are zero on exactly the same orange curve, so they make the same claim about \(\beta\).</p><p>But they are different functions, with different values and different gradients at \(\hat\beta\). So the delta method draws two different linearised nulls (green and pink), and the two Wald statistics differ.</p><p class="key"><strong>The Wald test is not invariant to how the restriction is written.</strong> At the starting estimate, version A does not reject and version B does.</p>`},
 {id:'invsim',part:'E',view:'nl',t:'Which version keeps its size?',fig:[1],ctl:['new','ten','more','n'],btnFirst:true,k0:200,newLabel:'Draw an estimate',tenLabel:'Draw 10',moreLabel:'Draw 100',hint:'Every dot is an estimate drawn with H₀ true. Pink dots: only version B rejects. Raise n and both rates approach 5%.',
  text:T`<p>To judge a test, run it many times with \(H_0\) true. A 5% test should reject 5% of the time.</p><p>Each dot is an estimate from a sample generated with \(\beta=(2,\,0.5)\), the ringed point on the curve, so \(H_0\) holds. Each dot is tested both ways and coloured by which versions reject it.</p><p class="key">Version B, with \(1/\beta_2\), <strong>rejects far more often than 5%</strong>. When \(\hat\beta_2\) is small and noisy, \(1/\hat\beta_2\) is far from linear and its tangent is a poor guide.</p><p>In large samples \(\hat\beta\) stays close to \(\beta\), where every tangent is a good approximation. Raise \(n\): both rates approach 5%.</p>`},
 {id:'recap',part:'F',t:'Recap: two t-tests or one Wald test',fig:[1],ctl:['r','alpha'],hint:'Move the correlation: the box stays put while the ellipse tilts. Move α: both grow or shrink. Purple: only Wald rejects; dark: only the two t-tests reject.',
  text:T`<p>The figure puts the two rules side by side one last time, on estimates drawn with \(H_0\) true: <strong>two separate t-tests</strong> (the box, each at the usual critical value) and <strong>the Wald test</strong> (the ellipse, at the \(\chi^2_2\) critical value). The readout shows how often each rejects, and how often they disagree.</p><p class="eq">\(W=d'\,(G\hat VG')^{-1}d\;\sim\;\chi^2_q\)</p><ul><li>\(d\) is how far the estimate is from satisfying \(H_0\): \(R\hat\beta-r\), or \(g(\hat\beta)\).</li><li>\(G\) is \(R\) for linear restrictions, and the gradient of \(g\) at \(\hat\beta\) otherwise.</li><li>\(q\) is the number of restrictions, not the number of coefficients.</li><li>Correlated estimates: the data pin down some combinations of coefficients much better than others, and the test has to know which.</li><li>A joint test is not two t-tests: the box has the wrong size, and the wrong shape.</li><li>The same t-statistics can be strong or weak evidence; \(\hat V^{-1}\) accounts for the correlation, \(t_1^2+t_2^2\) does not.</li><li>\(W\) is the squared length of \(d\) once the noise is whitened. The ellipses are its contours.</li><li>The confidence region is every \(\beta_0\) the test does not reject.</li><li>A nonlinear Wald test depends on how \(g\) is written.</li></ul>`}
];
const parts={A:'Warm-up',B:'Correlated estimates',C:'A joint null',D:'One linear restriction',E:'Nonlinear',F:'Recap'};
// "@{id}" in a step's text becomes a link to that step, so references survive reordering
const refs=s=>s.replace(/@\{(\w+)\}/g,(m,id)=>{const i=steps.findIndex(x=>x.id===id);return i<0?m:`<a href="#" data-go="${i}">step ${i+1}</a>`});

function tex(s){return s.replace(/\\\((.+?)\\\)([.,:;]?)/g,(m,t,p)=>{let h=t;try{h=katex.renderToString(t,{output:'mathml',throwOnError:false})}catch(e){}return p?`<span style="white-space:nowrap">${h}${p}</span>`:h})}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const f2=v=>(Math.abs(v)<0.005?0:v).toFixed(2);
const f3=v=>(Math.abs(v)<0.0005?0:v).toFixed(3);
const pct=v=>(100*v).toFixed(1)+'%';
// A squared number for captions, bracketed when negative
const sq=v=>(v<-.005?`(${f2(v)})`:f2(v))+"²";
const pair=(b,f=f2)=>`(${f(b[0])}, ${f(b[1])})`;
const col=(s,w)=>s+' '.repeat(Math.max(0,w-s.replace(/[̂̃̄]/g,'').length));
const halo=t=>{t.style.cssText+='paint-order:stroke;stroke:var(--panel);stroke-width:4px';return t};
function el(tag,at,p){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,c,cls,anchor){const t=el('text',{x,y,'text-anchor':anchor||'start',class:cls||''},p);t.textContent=s;t.style.fill=c||'var(--muted)';return t}
function seg(p,a,b,c,w,dash,op){el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:c,'stroke-width':w||1.5,'stroke-dasharray':dash||'none',opacity:op??1},p)}
function marker(p,x,y,c,r){el('circle',{cx:x,cy:y,r:r||6,fill:c,stroke:'var(--panel)','stroke-width':2},p)}
function ticks(lo,hi,k){const raw=(hi-lo)/k,s_=Math.pow(10,Math.floor(Math.log10(raw)));const m=[1,2,2.5,5,10].find(m=>m*s_>=raw)*s_;const out=[];for(let v=Math.ceil(lo/m-1e-9)*m;v<=hi+1e-9;v+=m)out.push(+v.toFixed(6));return out}

/* ---------- statistics ---------- */
const npdf=(x,m,s)=>Math.exp(-.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
// Standard normal CDF, Abramowitz and Stegun 26.2.17 (error below 1e-7)
function Phi(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
const pval=z=>2*(1-Phi(Math.abs(z)));
const crit=a=>{let lo=0,hi=10;for(let i=0;i<60;i++){const m=(lo+hi)/2;if(pval(m)>a)lo=m;else hi=m}return(lo+hi)/2};
// χ² with 1 or 2 degrees of freedom: density, critical value, p-value
const chi=(x,q)=>x<0?0:q===2?Math.exp(-x/2)/2:x===0?0:Math.exp(-x/2)/Math.sqrt(2*Math.PI*x);
const cq=(a,q)=>q===1?crit(a)**2:-2*Math.log(a);
const pq=(W,q)=>q===1?pval(Math.sqrt(W)):Math.exp(-W/2);

/* ---------- 2×2 matrices ---------- */
const det=M=>M[0][0]*M[1][1]-M[0][1]*M[1][0];
const inv2=M=>{const d=det(M);return[[M[1][1]/d,-M[0][1]/d],[-M[1][0]/d,M[0][0]/d]]};
// Symmetric square root of a 2×2 positive definite matrix
const sqrtm=M=>{const s=Math.sqrt(det(M)),t=Math.sqrt(M[0][0]+M[1][1]+2*s);return[[(M[0][0]+s)/t,M[0][1]/t],[M[1][0]/t,(M[1][1]+s)/t]]};
const mv=(M,v)=>[M[0][0]*v[0]+M[0][1]*v[1],M[1][0]*v[0]+M[1][1]*v[1]];
const quad=(d,M)=>d[0]*(M[0][0]*d[0]+M[0][1]*d[1])+d[1]*(M[1][0]*d[0]+M[1][1]*d[1]);
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
// OLS covariance of (β̂₁, β̂₂): σ²/n times the inverse covariance matrix of (log K, log L)
function V(){const SDL=st.sdl,k=SIG*SIG/(st.n*(1-st.r*st.r)),c=-st.r*k/(SDK*SDL);return[[k/(SDK*SDK),c],[c,k/(SDL*SDL)]]}
const se=Vm=>[Math.sqrt(Vm[0][0]),Math.sqrt(Vm[1][1])];
// One linear restriction a·β = c: W, and the point of the null where the ellipse around β̂ touches it
function linTest(b,a,c,Vm){const d=dot(a,b)-c,s=quad(a,Vm),Va=mv(Vm,a);return{d,s,W:d*d/s,star:[b[0]-Va[0]*d/s,b[1]-Va[1]*d/s]}}
// The nonlinear null β₁β₂ = 1, written two ways
const gA=b=>({g:b[0]*b[1]-1,G:[b[1],b[0]]});
const gB=b=>({g:b[0]-1/b[1],G:[1,1/(b[1]*b[1])]});
const nlTest=(b,o,Vm)=>linTest(b,o.G,dot(o.G,b)-o.g,Vm);
// Distance from β̂ to the curve itself, in the W metric: minimise over the positive branch β = (1/t, t)
function toCurve(b,Vi){const f=t=>quad(sub(b,[1/t,t]),Vi);let bt=1,bv=Infinity;
  for(let i=0;i<=600;i++){const t=Math.exp(-4+8*i/600),v=f(t);if(v<bv){bv=v;bt=t}}
  let lo=bt*Math.exp(-8/600),hi=bt*Math.exp(8/600);for(let i=0;i<60;i++){const a=lo+(hi-lo)*.382,c=lo+(hi-lo)*.618;if(f(a)<f(c))hi=c;else lo=a}
  const t=(lo+hi)/2;return{L:f(t),pt:[1/t,t]}}

/* ---------- data ---------- */
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const boxMuller=r=>Math.sqrt(-2*Math.log(r()+1e-12))*Math.cos(2*Math.PI*r());
const at=(c,z,R)=>[c[0]+R[0][0]*z[0]+R[0][1]*z[1],c[1]+R[1][0]*z[0]+R[1][1]*z[1]];
// One sample's estimate: the truth plus correlated normal noise with covariance V
function sample(seed){const r=mulberry32(seed*7919+13);return at(TRUE,[boxMuller(r),boxMuller(r)],sqrtm(V()))}
// Fixed standard normal pairs; scaling them by V^{1/2} gives draws that morph smoothly as n and r move
let ZS=null;const sims=()=>{if(!ZS){const r=mulberry32(271);ZS=Float64Array.from({length:2*NSIM},()=>boxMuller(r))}return ZS};
const zi=i=>{const Z=sims();return[Z[2*i],Z[2*i+1]]};
/* ---------- chart pieces ---------- */
function frame(s,xr,yr,xl,yl,Wd,Hd,o={}){s.innerHTML='';s.setAttribute('viewBox',`0 0 ${Wd} ${Hd}`);s._pts=[];
  const pl=o.noy?16:o.pl??50,pr_=14,pt=10,pb=40,fx=o.fx||(v=>v),fy=o.fy||(v=>v);
  const sx=v=>pl+(v-xr[0])/(xr[1]-xr[0])*(Wd-pl-pr_),sy=v=>Hd-pb-(v-yr[0])/(yr[1]-yr[0])*(Hd-pt-pb);
  ticks(xr[0],xr[1],o.kx||6).forEach(t=>{seg(s,[sx(t),pt],[sx(t),Hd-pb],'var(--grid)',1);txt(s,sx(t),Hd-pb+15,fx(t),null,'','middle')});
  if(!o.noy){ticks(yr[0],yr[1],o.ky||4).forEach(t=>{seg(s,[pl,sy(t)],[Wd-pr_,sy(t)],'var(--grid)',1);txt(s,pl-6,sy(t)+4,fy(t),null,'','end')});seg(s,[pl,pt],[pl,Hd-pb],'var(--fg)',1.2)}
  seg(s,[pl,Hd-pb],[Wd-pr_,Hd-pb],'var(--fg)',1.2);
  txt(s,(pl+Wd-pr_)/2,Hd-5,xl,'var(--fg)','lab','middle');
  if(yl){const m=(pt+Hd-pb)/2,t=txt(s,13,m,yl,'var(--fg)','lab','middle');t.setAttribute('transform',`rotate(-90 13 ${m})`)}
  const cid='clip-'+s.id,cp=el('clipPath',{id:cid},el('defs',{},s));el('rect',{x:pl,y:pt,width:Wd-pl-pr_,height:Hd-pt-pb},cp);
  return[sx,sy,el('g',{'clip-path':`url(#${cid})`},s),{pl,pr_,pt,pb,Wd,Hd}]}
function bell(g,sx,sy,f,xr,o={}){const N=240,at_=(a,b)=>Array.from({length:N+1},(_,i)=>a+(b-a)*i/N);
  (o.fill||[]).forEach(([a,b,c,op])=>{a=Math.max(a,xr[0]);b=Math.min(b,xr[1]);if(b<=a)return;const xs=at_(a,b);
    el('polygon',{points:`${sx(a)},${sy(0)} ${xs.map(x=>sx(x).toFixed(1)+','+sy(f(x)).toFixed(1)).join(' ')} ${sx(b)},${sy(0)}`,fill:c,'fill-opacity':op??.3},g)});
  el('polyline',{points:at_(xr[0],xr[1]).map(x=>sx(x).toFixed(1)+','+sy(f(x)).toFixed(1)).join(' '),fill:'none',stroke:o.c||'var(--fg)','stroke-width':o.w||2,'stroke-dasharray':o.dash||'none'},g)}
function vline(s,g,sx,m,x,c,lab,o={}){seg(g,[sx(x),m.pt],[sx(x),m.Hd-m.pb],c,o.w||2,o.dash);
  if(lab){const right=o.side?o.side==='r':sx(x)<(m.pl+m.Wd-m.pr_)/2;halo(txt(s,sx(x)+(right?6:-6),m.pt+13+(o.row||0)*16,lab,'var(--fg)','',right?'start':'end'))}}
function legend(items){const e=$('legend');e.innerHTML='';items.forEach(([k,c,t])=>{const i=document.createElement('span'),sw=document.createElement('i');i.className='li';sw.className='sw '+k;sw.style.setProperty('--c',c);i.append(sw,t);e.append(i)})}
function arrowS(p,a,b,c,w){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);if(L<4)return;const ux=dx/L,uy=dy/L,h=Math.min(10,L*.5);
  seg(p,a,[b[0]-ux*h,b[1]-uy*h],c,w);el('polygon',{points:`${b[0]},${b[1]} ${b[0]-ux*h-uy*4.5},${b[1]-uy*h+ux*4.5} ${b[0]-ux*h+uy*4.5},${b[1]-uy*h-ux*4.5}`,fill:c},p)}

/* ---------- the parameter plane ---------- */
const VIEW={cd:{x:[-.15,1.05],y:[.2,1.4],g:.2,xl:'β₁, capital',yl:'β₂, labour'},nl:{x:[-.2,3.2],y:[-.2,3.2],g:.5,xl:'β₁',yl:'β₂'}};
// Everything is built in β coordinates and passed through one affine map. At m = 0 it is the identity;
// at m = 1 it is the whitening V^{-1/2}, scaled by det(V)^{1/4} so that areas keep their size
function plane(s,o={}){const vw=VIEW[o.view||'cd'],Wd=440,Hd=430,pl=50,pt=8,w=380,h=380,X=vw.x,Y=vw.y,span=X[1]-X[0];
  s.innerHTML='';s.setAttribute('viewBox',`0 0 ${Wd} ${Hd}`);s._pts=[];

      return col(lab,4)+col(`${f2(t[0])}, ${f2(t[1])}`,14)+col(box?'reject':'keep',9)+col(f2(W),8)+(W>cc?'reject':'keep')};
    L.push(col('',4)+col('t₁, t₂',14)+col('box',9)+col('W',8)+'ellipse',...WRONG.map(([l,t])=>row(l,t)),'',c('corr of the estimates')+f2(Vm[0][1]/(s1*s2)),'with H₀ true, in the long run:',c('  box rejects')+pct(r.b),c('  ellipse rejects')+pct(r.e));break}
  case 'region':{const W=quad(sub(st.bB,st.probe),inv2(Vm)),cc=cq(st.alpha,2);L.push(c('β₀ being tested')+pair(st.probe),c('W')+f2(W),c('p-value')+f3(pq(W,2)),c('decision')+dec(W>cc),c('cells tested')+vis.size);break}
  case 'line0':{const b=st.bC;L.push(c('your estimate')+pair(b,f3),c('sum of the estimates')+f3(b[0]+b[1]),c('d = sum − 1')+f3(b[0]+b[1]-1),c('its standard error')+'next step');break}
  case 'line':{const T_=linTest(st.bC,[1,1],1,Vm),cc=cq(.05,1),sn=Math.sqrt(Vm[0][0]+Vm[1][1]);L.push(c('sum of the estimates')+f3(st.bC[0]+st.bC[1]),c('d')+f3(T_.d),c('se(d)')+f3(Math.sqrt(T_.s)),c('t = d / se(d)')+f2(T_.d/Math.sqrt(T_.s)),c('W = t²')+f2(T_.W),c('decision at 5%')+dec(T_.W>cc),'',
    c('se ignoring the cov')+f3(sn),c('t ignoring the cov')+f2(T_.d/sn)+(Math.abs(T_.d/sn)>1.96?'  reject':'  do not reject'));break}
  case 'touch':{const b=st.bC,T_=linTest(b,[1,1],1,Vm),Vi=inv2(Vm),foot=[b[0]-(b[0]+b[1]-1)/2,b[1]-(b[0]+b[1]-1)/2];
    L.push(c('W')+f3(T_.W),c('touching point')+pair(T_.star,f3),c('W-distance to it')+f3(quad(sub(b,T_.star),Vi)),'',c('nearest point, ordinary')+pair(foot,f3),c('W-distance to it')+f3(quad(sub(b,foot),Vi))+'  larger');break}
  case 'curve':{const b=st.bD;L.push(c('your estimate')+pair(b),c('d = g(estimate)')+f3(gA(b).g),c('standard error of d')+'needs the next step');break}
  case 'tangent':{const b=st.bD,A=gA(b),TA=nlTest(b,A,Vm);L.push(c('your estimate')+pair(b),c('d = g(estimate)')+f3(A.g),c('gradient G')+pair(A.G),c("se(d) ≈ √(GV̂G')")+f3(Math.sqrt(TA.s)));break}
  case 'linnull':{const b=st.bD,A=gA(b),TA=nlTest(b,A,Vm),cc=cq(.05,1);L.push(c('d = g(estimate)')+f3(A.g),c("se(d) ≈ √(GV̂G')")+f3(Math.sqrt(TA.s)),c("W = d² / GV̂G'")+f2(TA.W),c('critical value, χ²₁')+'3.84',c('decision at 5%')+dec(TA.W>cc));break}
  case 'far':{const b=st.bD,TA=nlTest(b,gA(b),Vm),C_=toCurve(b,inv2(Vm)),cc=cq(.05,1);L.push(c('Wald W, tangent line')+col(f2(TA.W),8)+dec(TA.W>cc),c('distance to the curve')+col(f2(C_.L),8)+dec(C_.L>cc));break}
  case 'inv':{const b=st.bD,A=gA(b),B=gB(b),TA=nlTest(b,A,Vm),TB=nlTest(b,B,Vm),cc=cq(.05,1),w=16;
    L.push(c('',22)+col('A: β₁β₂ − 1',w)+'B: β₁ − 1/β₂',c('g at the estimate',22)+col(f3(A.g),w)+f3(B.g),c('gradient G',22)+col(pair(A.G),w)+pair(B.G),c('W',22)+col(f2(TA.W),w)+f2(TB.W),c('decision at 5%',22)+col(TA.W>cc?'reject':'do not reject',w)+(TB.W>cc?'reject':'do not reject'));break}
  case 'invsim':{const R=sqrtm(Vm),cc=cq(.05,1),sim=k=>{let a=0,b=0;for(let i=0;i<k;i++){const x=at(TNL,zi(i),R);a+=nlTest(x,gA(x),Vm).W>cc;b+=Math.abs(x[1])>1e-6&&nlTest(x,gB(x),Vm).W>cc}return[a,b]};
    const[a,b]=sim(st.k),[la,lb]=sim(NSIM);L.push(c('n')+st.n,c('estimates drawn')+st.k,'',c('A: β₁β₂ − 1 rejects')+col(String(a),7)+pct(a/st.k),c('B: β₁ − 1/β₂ rejects')+col(String(b),7)+pct(b/st.k),'','in the long run, with H₀ true:',c('  A rejects')+pct(la/NSIM),c('  B rejects')+pct(lb/NSIM));break}
  case 'recap':{const R=sqrtm(Vm),Vi=inv2(Vm),z=crit(st.alpha),c2=cq(st.alpha,2);let b=0,e=0,dis=0;
    for(let i=0;i<NSIM;i++){const d=at([0,0],zi(i),R),ob=Math.abs(d[0])>z*s1||Math.abs(d[1])>z*s2,oe=quad(d,Vi)>c2;b+=ob;e+=oe;dis+=ob!==oe}
    L.push(c('corr of the estimates')+f2(Vm[0][1]/(s1*s2)),c('α')+f2(st.alpha),'',c('two t-tests: reject if')+`|t| > ${f2(z)}`,c('Wald: reject if')+`W > ${f2(c2)}`,'',`with H₀ true, in the long run:`,c('  two t-tests reject')+pct(b/NSIM),c('  Wald rejects')+pct(e/NSIM),c('  the two disagree')+pct(dis/NSIM));break}
  }
  $('readout').textContent=L.join('\n');
}

/* ---------- render ---------- */
const SL=['n','r','sdl','cbox','m','alpha'],BT=['new','ten','more','rand','all','reveal','wa','wb','wc'];
function go(k){const prev=st.step,step=steps[k],f=$('fig'),same=steps[prev].part===step.part;
  if(!same)Object.assign(st,{n:DEF.n,r:DEF.r,sdl:DEF.sdl},PS[step.part]||{});
  st.step=k;Object.assign(st,JSON.parse(JSON.stringify(step.set||{})));st.reveal=false;st.k=step.k0||10;vis=new Set;allTested=false;visit(st.probe);
  f.innerHTML='';f.classList.toggle('pair',!!step.pair);$('grid').classList.toggle('wide',!!step.pair);P=step.fig.map((c,i)=>{const d=document.createElement('div'),l=document.createElement('div'),s=document.createElementNS(NS,'svg');d.className='cell';l.className='plabel';s.id='p'+i;s.setAttribute('role','img');d.append(l,s);f.append(d);return s});
  if(step.drag)P[0].classList.add('drag');
  render()}
const RNG0={};['n','r','sdl','cbox','m','alpha'].forEach(c=>RNG0[c]=[$(c).min,$(c).max]);
function render(){
  const k=st.step,step=steps[k],show=step.ctl;
  [...$('nav').querySelectorAll('button')].forEach((b,i)=>{b.classList.toggle('on',i===k);b.classList.toggle('done',i<k);b.setAttribute('aria-current',i===k?'step':'false')});
  $('stepnum').textContent=`Part ${step.part} · ${parts[step.part]} · Step ${k+1} of ${steps.length}`;
  $('stitle').textContent=step.t;
  const body=refs(step.text);$('stext').innerHTML=typeof katex!=='undefined'?tex(body):body.replace(/\\\(|\\\)/g,'');
  $('hint').textContent=step.hint;
  SL.forEach(c=>{$('c-'+c).hidden=!show.includes(c);const r=(step.rng||{})[c]||RNG0[c];$(c).min=r[0];$(c).max=r[1]});BT.forEach(c=>{$(c).hidden=!show.includes(c)});
  $('new').textContent=step.newLabel||'New sample';$('ten').textContent=step.tenLabel||'Draw 10';$('more').textContent=step.moreLabel||'Draw 100';
  document.querySelector('.controls').classList.toggle('btnfirst',!!step.btnFirst);
  $('prev').disabled=k===0;$('next').disabled=k===steps.length-1;
  draw()}
function draw(){const id=steps[st.step].id;
  $('reveal').textContent=st.reveal?'Hide answer':'Show answer';
  figure(id);readout(id);
  // Say on the plot itself that it responds to the pointer
  const dg=steps[st.step].drag;if(dg)halo(txt(P[0],426,26,dg==='probe'?'click or drag: the triangle follows':'click or drag: your estimate follows','var(--muted)','','end'));
  SL.forEach(c=>{$(c).value=st[c];$(c+'o').textContent=c==='n'?st.n:f2(st[c])})}

/* nav */
let lastPart='';steps.forEach((s,i)=>{if(s.part!==lastPart){const p=document.createElement('span');p.className='part';p.textContent=parts[s.part];$('nav').appendChild(p);lastPart=s.part}
  const b=document.createElement('button');b.textContent=i+1;b.title=s.t;b.setAttribute('aria-label',`Step ${i+1}: ${s.t}`);b.onclick=()=>go(i);$('nav').appendChild(b)});
$('prev').onclick=()=>{if(st.step>0)go(st.step-1)};
$('next').onclick=()=>{if(st.step<steps.length-1)go(st.step+1)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
SL.forEach(c=>$(c).addEventListener('input',()=>{st[c]=+$(c).value;draw()}));
$('stext').addEventListener('click',e=>{const a=e.target.closest('a[data-go]');if(a){e.preventDefault();go(+a.dataset.go)}});
// Draw buttons: more draws under H₀ on the box and size steps, a new sample elsewhere
const drawMany=k=>{const id=steps[st.step].id;
  if(['twot','compare','invsim'].includes(id))st.k=Math.min(st.k+k,NSIM);
  else st.seed=st.seed%500+1;
  draw()};
$('new').onclick=()=>drawMany(1);
$('ten').onclick=()=>drawMany(10);
$('more').onclick=()=>drawMany(100);
$('all').onclick=()=>{for(let i=0;i<NG*NG;i++)vis.add(i);allTested=true;draw()};
let randSeed=1;
$('rand').onclick=()=>{const r=mulberry32(randSeed++*104729),X=VIEW.cd.x,Y=VIEW.cd.y;for(let i=0;i<20;i++){const b=[X[0]+r()*(X[1]-X[0]),Y[0]+r()*(Y[1]-Y[0])];visit(b);st.probe=b.map(v=>Math.round(v*200)/200)}draw()};
$('reveal').onclick=()=>{st.reveal=!st.reveal;draw()};
$('reset').onclick=()=>{const s=st.step;Object.assign(st,fresh(),PS[steps[s].part]||{});go(s)};
// Witness presets: the correlation of the inputs is minus that of the estimates
[['wa',0],['wb',.85],['wc',-.85]].forEach(([id,r])=>$(id).onclick=()=>{st.r=r;draw()});

/* dragging in the plane */
const svgPt=(svg,e)=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
let dragging=false;
function moveTo(e){const step=steps[st.step],s=P[0],q=svgPt(s,e),b=s._inv(q.x,q.y),vw=VIEW[step.view||'cd'],r=v=>Math.round(v*200)/200;
  let v=[clamp(b[0],vw.x[0]+.01,vw.x[1]-.01),clamp(b[1],vw.y[0]+.01,vw.y[1]-.01)].map(r);
  if(step.view==='nl')v=v.map(x=>Math.max(x,.05));
  if(step.drag==='probe'){st.probe=v;visit(v)}else st[step.drag]=v;draw()}
$('fig').addEventListener('pointerdown',e=>{const s=e.target.closest('svg');if(!s||s!==P[0]||!steps[st.step].drag)return;dragging=true;moveTo(e);e.preventDefault()});
window.addEventListener('pointermove',e=>{if(dragging)moveTo(e)});
window.addEventListener('pointerup',()=>{dragging=false});

/* tooltips */
window.addEventListener('pointermove',e=>{const t=e.target,tip=$('tip');let s=null;if(dragging){tip.hidden=true;return}
  const svg=t.closest&&t.closest('svg');if(svg&&svg._pts&&svg._pts.length){const q=svgPt(svg,e);let best=200;svg._pts.forEach(p=>{const d=(p[0]-q.x)**2+(p[1]-q.y)**2;if(d<best){best=d;s=p[2]}})}
  tip.hidden=!s;if(s){tip.textContent=s;tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=Math.max(4,e.clientY-30)+'px'}});

go(0);
})();
</script>
