<div class="wrap">
  <header>
    <h1>Frisch–Waugh–Lovell Theorem</h1>
    <p class="sub">The theorem, then what partialling out does to variance, one piece at a time. It picks up where <a href="regression-geometry.html">Regression Geometry</a> ends. Use the buttons or the ← → keys.</p>
  </header>

        <div class="row">
          <button id="mask">Set β₂ = −β₁δ</button>

<script>
(function(){
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const DEF={b1:2,b2:3,rho:0.7,n:200,seed:1,hold:'x1'};
const st={step:0,...DEF};
const SIG=1,NSIM=500,NMAX=500;
const T=String.raw;

const steps=[
 {id:'scatter',part:'A',t:'Two regressors, one effect',ctl:['b1','b2','rho','n','seed'],hint:'Move the sliders: the fitted slope leaves the true one whenever ρ and β₂ are both non-zero.',
  text:T`<p>Suppose the outcome depends on two variables: \(y=\beta_1X_1+\beta_2X_2+\varepsilon\). We want \(\beta_1\), the effect of \(X_1\) holding \(X_2\) fixed. The data here are simulated, so the true value is known.</p><p>The plot shows the short regression of \(y\) on \(X_1\) alone. Throughout, \(\rho\) is the correlation between \(X_1\) and \(X_2\), \(\text{Var}(X_2)=1\) and \(\sigma^2=\text{Var}(\varepsilon)=1\).</p>`},
 {id:'ovb',part:'A',t:'Omitted variable bias',sub:1,ctl:['b1','b2','rho'],hint:'Set β₂ or ρ to zero and the bias disappears.',
  text:T`<p>Colour the dots by \(X_2\). Within one shade, the slope is close to \(\beta_1\). When \(\rho\) and \(\beta_2\) are positive, high-\(X_2\) dots have both higher \(X_1\) and higher \(y\), so the pooled slope picks up the difference between shades as well.</p><p>The short slope is \(\beta_1+\beta_2\,\text{Cov}(X_1,X_2)/\text{Var}(X_1)\). The bias needs both \(\beta_2\neq0\) and \(\rho\neq0\). Adding \(X_2\) as a regressor, the long regression, removes it.</p>`},
 {id:'px1',part:'B',t:'Partial X₂ out of X₁',sub:1,ctl:['rho','n','seed'],hint:'The red segments are a sample of the residuals. Both panels share a vertical scale.',
  text:T`<p>Regress \(X_1\) on \(X_2\) and keep the residual: \(\tilde X_1=M_2X_1\). This is the residual maker \(M\) from <a href="regression-geometry.html">Regression Geometry</a>, with \(X_2\) and an intercept as the regressors.</p><p>\(\tilde X_1\) is the part of \(X_1\) that \(X_2\) cannot predict. Plotted against \(X_2\) in the lower panel, it has no slope left, by construction.</p>`},
 {id:'py',part:'B',t:'Partial X₂ out of y',sub:1,ctl:['b1','b2','rho'],hint:'The red segments are a sample of the residuals. Both panels share a vertical scale.',
  text:T`<p>Do the same to the outcome: \(\tilde y=M_2y\). What remains is the part of \(y\) that \(X_2\) cannot predict.</p><p>Applying \(M_2\) to the model removes \(X_2\), because \(M_2X_2=0\): \(\tilde y=\beta_1\tilde X_1+M_2\varepsilon\). So \(\tilde y\) and \(\tilde X_1\) are still linked by \(\beta_1\), now with \(X_2\) out of the way.</p>`},
 {id:'three',part:'B',t:'Three routes, one coefficient',quad:1,sub:1,ctl:['b1','b2','rho','n','seed'],hint:'All four panels share the same axes, so the narrower clouds really are narrower.',
  text:T`<p>Every regression here has an intercept. The theorem gives three equivalent ways to obtain \(\hat\beta_1\):</p><ol><li>The long regression of \(y\) on \(X_1\) and \(X_2\): \(\hat\beta=(X'X)^{-1}X'y\), where \(\hat\beta_1\) is the entry for \(X_1\).</li><li>Residual on residual: \(\hat\beta_1=(\tilde X_1'\tilde X_1)^{-1}\tilde X_1'\tilde y\).</li><li>\(y\) on the residual: \(\hat\beta_1=(\tilde X_1'\tilde X_1)^{-1}\tilde X_1'y\).</li></ol><p>The match is exact in every sample, not just on average. Routes 2 and 3 agree because \(M_2\) is symmetric and \(M_2M_2=M_2\), so \(\tilde X_1'\tilde y=X_1'M_2y=\tilde X_1'y\).</p><p>\(\tilde y\) and \(\tilde X_1\) are the variation the control leaves unexplained, so regressing one on the other isolates the partial effect of \(X_1\).</p>`},
 {id:'one',part:'B',t:'Partialling out one side only',quad:1,ctl:['b1','b2','rho','n','seed'],hint:'Compare the two outlined panels with the residual-on-residual panel.',
  text:T`<p>Residualise only \(y\) (top right) and the slope is attenuated: it equals \(\hat\beta_1\,\text{Var}(\tilde X_1)/\text{Var}(X_1)\). \(X_1\) still carries the variation that \(X_2\) explains, and that variation is now unrelated to \(\tilde y\).</p><p>Residualise only \(X_1\) (bottom left) and the slope is right, because what \(X_2\) explains in \(y\) is orthogonal to \(\tilde X_1\). But it stays in the residual, so the standard error is too large whenever \(X_2\) explains part of \(y\).</p><p>Residual on residual removes it, and matches the long regression's standard error up to the degrees of freedom, \(n-2\) rather than \(n-3\).</p>`},
 {id:'var',part:'C',t:'X̃₁ has less variance than X₁',sub:1,ctl:['rho','n','seed'],hint:'Move ρ, or drag the dot along the curve.',
  text:T`<p>Residualising strips out the part of \(X_1\) that moves with \(X_2\). How much goes depends only on the correlation:</p><p>\(\text{Var}(\tilde X_1)=(1-\rho^2)\,\text{Var}(X_1).\)</p><p>The share lost is \(\rho^2\), so modest correlation costs little: \(\rho=0.5\) removes a quarter of the variance, while \(\rho=0.9\) removes 81%.</p>`},
 {id:'split',part:'C',t:'Same correlation, different X₁',ctl:['rho','hold'],hint:'Move ρ and compare the bars. The toggle picks the case used from here on.',
  text:T`<p>Write \(X_1=\delta X_2+\nu\): a part driven by \(X_2\), and a part of its own. Then \(\text{Var}(X_1)=\delta^2+\text{Var}(\nu)\), and \(\tilde X_1\) is the part \(\nu\).</p><p>\(\rho^2\) is the shared part's share, and the same share can arise in two ways. Either shared variation replaces \(X_1\)'s own variation, so \(\text{Var}(\tilde X_1)\) falls. Or it is added on top, so \(\text{Var}(X_1)\) grows and \(\text{Var}(\tilde X_1)\) stays put. The ratio is the same, but the variation left over is not.</p>`},
 {id:'beta',part:'C',t:'The βs move ỹ, not X̃₁',ctl:['b1','b2','rho','mask'],hint:'Change β₁ and β₂: only the y bar moves. Then press the button to cancel the two channels.',
  text:T`<p>\(\tilde X_1\) is computed without looking at \(y\), so \(\beta_1\) and \(\beta_2\) cannot affect its variance. They do decide what partialling out does to \(y\). Substituting \(X_1=\delta X_2+\nu\) gives</p><p>\(y=(\beta_2+\beta_1\delta)X_2+\beta_1\nu+\varepsilon.\)</p><p>\(\beta_2+\beta_1\delta\) is \(X_2\)'s total effect on \(y\): direct, plus through \(X_1\). Partialling out removes \((\beta_2+\beta_1\delta)^2\text{Var}(X_2)\) from \(\text{Var}(y)\). If the two channels cancel, \(X_2\) looks unrelated to \(y\) and nothing is removed from it. \(X_1\) is still stripped, and the short regression is still biased.</p>`},
 {id:'noise',part:'D',t:'Less variation, noisier slope',sim:1,ctl:['rho','n','hold'],hint:'The x-axis stays fixed as ρ moves, so a wider curve means a noisier estimate.',
  text:T`<p>\(\hat\beta_1\) is a regression on \(\tilde X_1\), so only \(\tilde X_1\)'s variation identifies it:</p><p>\(\text{Var}(\hat\beta_1)\approx\dfrac{\sigma^2}{n\,\text{Var}(\tilde X_1)}=\dfrac{\sigma^2}{n\,\text{Var}(X_1)}\cdot\dfrac{1}{1-\rho^2}.\)</p><p>The last factor is the variance inflation factor. With \(\text{Var}(X_1)\) fixed, it widens the distribution as \(|\rho|\) grows. Now switch to holding \(\text{Var}(\nu)\), the variance of \(X_1\)'s own part, fixed: the factor still rises, \(\text{Var}(X_1)\) rises with it, and the spread does not move. What costs precision is losing \(X_1\)'s own variation, not correlation as such.</p>`},
 {id:'trade',part:'D',t:'Bias against precision',sim:1,sub:1,ctl:['b2','rho','n','hold'],hint:'The mean of each distribution is dotted. Drag the dot on the map to move ρ and β₂ together.',
  text:T`<p>Dropping \(X_2\) biases the slope, but it does not always make it noisier. The two variances are</p><p>\(\dfrac{\sigma^2}{n\,\text{Var}(\tilde X_1)}\) long, \(\quad\dfrac{\sigma^2+\beta_2^2(1-\rho^2)}{n\,\text{Var}(X_1)}\) short.</p><p>The control does two things. It takes \(X_2\) out of the error, which helps more the larger \(|\beta_2|\) is, and it takes variation out of the regressor, which hurts more the larger \(|\rho|\) is. The long regression is more precise when</p><p>\(|\beta_2|/\sigma>|\rho|/(1-\rho^2).\)</p><p>Below that line, the short regression is tighter but centred in the wrong place.</p>`},
 {id:'ext',part:'D',t:'The extremes',sim:1,sub:1,ctl:['rho','b2','n','hold','r0','r1'],hint:'The axes match the X₁ scale, so the cloud narrows as X̃₁ loses variance.',
  text:T`<p>At \(\rho=0\), \(\tilde X_1\) is essentially \(X_1\), and the two regressions are centred on the same value. The control still earns its place: it removes \(X_2\) from the error, which shrinks the standard error.</p><p>As \(\rho\to\pm1\) with \(\text{Var}(X_1)\) fixed, \(\tilde X_1\) collapses towards zero. There is almost no variation left to identify \(\beta_1\). In the limit this is the perfect collinearity from <a href="regression-geometry.html">Regression Geometry</a>.</p>`}
];
const parts={A:'Why control',B:'The theorem',C:'Variance',D:'Consequences'};

// Trailing punctuation stays on the formula's line
function tex(s){return s.replace(/\\\((.+?)\\\)([.,:;]?)/g,(m,t,p)=>{let h=t;try{h=katex.renderToString(t,{output:'mathml',throwOnError:false})}catch(e){}return p?`<span style="white-space:nowrap">${h}${p}</span>`:h})}
const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const f2=v=>(Math.abs(v)<0.005?0:v).toFixed(2);
const f3=v=>(Math.abs(v)<0.0005?0:v).toFixed(3);
const col=(s,w)=>s+' '.repeat(Math.max(0,w-s.replace(/[̂̃]/g,'').length));
const halo=t=>{t.style.cssText+='paint-order:stroke;stroke:var(--panel);stroke-width:4px';return t};
function el(tag,at,p){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,c,cls,anchor){const t=el('text',{x,y,'text-anchor':anchor||'start',class:cls||''},p);t.textContent=s;t.style.fill=c||'var(--muted)';return t}
function seg(p,a,b,c,w,dash,op){el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:c,'stroke-width':w||1.5,'stroke-dasharray':dash||'none',opacity:op??1},p)}
function marker(p,x,y,c){el('circle',{cx:x,cy:y,r:6,fill:c,stroke:'var(--panel)','stroke-width':2},p)}
function ticks(lo,hi,k){const raw=(hi-lo)/k,s_=Math.pow(10,Math.floor(Math.log10(raw)));const m=[1,2,2.5,5,10].find(m=>m*s_>=raw)*s_;const out=[];for(let v=Math.ceil(lo/m-1e-9)*m;v<=hi+1e-9;v+=m)out.push(+v.toFixed(6));return out}
const nice=v=>[1,1.5,2,2.5,3,4,5,6,8,10,12,15,20,25,30,40,50,60,80,100].find(m=>m>=v)||v;
const sym=v=>{const m=nice(v);return[-m,m]};

/* ---------- data ---------- */
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const boxMuller=r=>Math.sqrt(-2*Math.log(r()+1e-12))*Math.cos(2*Math.PI*r());
// Var(X₂) = 1; ρ fixes the shared share, st.hold fixes which variance stays put
function pars(){const r=st.rho,q=1-r*r,sx=st.hold==='x1'?1:1/Math.sqrt(q),s=sx*Math.sqrt(q),d=r*sx;
  const tot=st.b2+st.b1*d,left=st.b1*st.b1*s*s+SIG*SIG;return{r,q,sx,s,d,tot,left,sy:Math.sqrt(tot*tot+left)}}
// Draws are fixed per seed and only rescaled, so the points move smoothly with the sliders
let Zseed=null,Z=null,SZ=null;
function draws(seed){if(seed!==Zseed){const r=mulberry32(seed*1337+42);Z=[0,1,2].map(()=>Array.from({length:NMAX},()=>boxMuller(r)));Zseed=seed}return Z}
function sample(){const{d,s}=pars(),n=st.n,[z2,zn,ze]=draws(st.seed);
  const X2=z2.slice(0,n),X1=X2.map((v,i)=>d*v+s*zn[i]),y=X1.map((v,i)=>st.b1*v+st.b2*X2[i]+SIG*ze[i]);
  return{n,X1,X2,y,tX1:resid(X2,X1),tY:resid(X2,y),iota:X1.map(()=>1)}}

function kde(vals){const n=vals.length,h=1.06*Math.sqrt(varr(vals))*Math.pow(n,-0.2),lo=Math.min(...vals)-3*h,hi=Math.max(...vals)+3*h;

  if(!o.noy)ticks(yr[0],yr[1],o.ky||5).forEach(t=>{seg(s,[pl,sy(t)],[Wd-pr_,sy(t)],'var(--grid)',1);txt(s,pl-6,sy(t)+4,t,null,'','end')});

function scatter(s,x,y,o){const[sx,sy,g]=frame(s,o.xr,o.yr,o.xl,o.yl,o.W||440,o.H||340),n=x.length,lo=o.xr[0],hi=o.xr[1];
  if(o.band){const f=o.band,xs=Array.from({length:60},(_,i)=>lo+i*(hi-lo)/59),w=v=>1.96*Math.sqrt(f.s2*(1/f.n+(v-f.mx)**2/f.sxx));
    const up=xs.map(v=>sx(v).toFixed(1)+','+sy(f.a+f.b*v+w(v)).toFixed(1)),dn=xs.map(v=>sx(v).toFixed(1)+','+sy(f.a+f.b*v-w(v)).toFixed(1)).reverse();

  switch(id){
  case 'scatter':L.push(`true β₁ = ${f3(st.b1)}`,`short slope = ${f3(short.b)}`);break;
  case 'ovb':{const g=fit(D.X1,D.X2).b;L.push(c('short slope',13)+`= ${f3(short.b)}`,c('β̂₁ + β̂₂·γ̂',13)+`= ${f3(l.b[1])} + ${f3(l.b[2])} × ${f3(g)} = ${f3(l.b[1]+l.b[2]*g)}`,c('population',13)+`= ${f2(st.b1)} + ${f2(st.b2)} × ${f2(p.r/p.sx)} = ${f2(st.b1+st.b2*p.r/p.sx)}`,`γ̂ = Cov(X₁, X₂) / Var(X₁), slope of X₂ on X₁`);break}
  case 'px1':L.push(`slope of X₁ on X₂ = ${f3(fit(D.X2,D.X1).b)}`,`slope of X̃₁ on X₂ = ${f3(fit(D.X2,D.tX1).b)}`);break;
  case 'py':L.push(`slope of y on X₂ = ${f3(fit(D.X2,D.y).b)}`,`slope of ỹ on X₂ = ${f3(fit(D.X2,D.tY).b)}`);break;
  case 'three':L.push(c('true β₁')+f3(st.b1),c('1. long')+f3(l.b[1]),c('2. ỹ on X̃₁')+f3(rs.b),c('3. y on X̃₁')+f3(ry.b),c('short, y on X₁')+f3(short.b)+'  biased');break;
  case 'one':L.push(c('')+'slope    SE',c('long')+f3(l.b[1])+'   '+f3(l.se[1]),c('ỹ on X̃₁')+f3(rs.b)+'   '+f3(rs.se),c('y on X̃₁')+f3(ry.b)+'   '+f3(ry.se),c('ỹ on X₁')+f3(ax.b)+'   '+f3(ax.se),'',`Var(X̃₁)/Var(X₁) = ${f3(vT/vX)}`,`β̂₁ × ${f3(vT/vX)} = ${f3(l.b[1]*vT/vX)}, slope of ỹ on X₁`);break;
  case 'var':{const r=fit(D.X2,D.X1).b*Math.sqrt(varr(D.X2)/vX);L.push(c('Var(X₁)',9)+`= ${f3(vX)}`,c('Var(X̃₁)',9)+`= ${f3(vT)}`,c('ratio',9)+`= ${f3(vT/vX)} = 1 − r²,  sample r = ${f3(r)}`);break}
  case 'split':{const q=p.q,r2=p.r*p.r;L.push(c('')+'δ²      Var(ν)  Var(X₁)',c('hold Var(X₁)')+[r2,q,1].map(v=>col(f2(v),8)).join(''),c('hold Var(ν)')+[r2/q,1,1/q].map(v=>col(f2(v),8)).join(''),`share removed in both: ρ² = ${f2(r2)}`);break}
  case 'beta':L.push(`δ = ${f2(p.d)}   total effect β₂ + β₁δ = ${f2(p.tot)}`,`Var(y)  = ${f2(p.sy*p.sy)}  (sample ${f2(varr(D.y))})`,`Var(ỹ)  = ${f2(p.left)}  (sample ${f2(varr(D.tY))})`,`removed = ${f2(p.tot*p.tot)}`,`Var(X̃₁)/Var(X₁) = ${f2(p.q)}, whatever the βs`);break;
  case 'noise':L.push(c('SD across simulations',23)+`= ${f3(S.L.sd)}`,c('σ / √(n Var(X̃₁))',23)+`= ${f3(SIG/Math.sqrt(n*p.s*p.s))}`,c('baseline at ρ = 0',23)+`= ${f3(SIG/Math.sqrt(n))}`,c('VIF = 1 / (1 − ρ²)',23)+`= ${f2(1/p.q)}`,`Var(X₁) = ${f2(p.sx*p.sx)}   Var(X̃₁) = ${f2(p.s*p.s)}`);break;
  case 'trade':{const a=Math.abs(st.b2)/SIG,b=Math.abs(p.r)/p.q;L.push(c('')+'long    short',c('mean')+col(f3(S.L.m),8)+f3(S.S.m),c('SD, simulated')+col(f3(S.L.sd),8)+f3(S.S.sd),c('SD, formula')+col(f3(SIG/Math.sqrt(n*p.s*p.s)),8)+f3(Math.sqrt((SIG*SIG+st.b2*st.b2*p.q)/(n*p.sx*p.sx))),c('RMSE')+col(f3(S.L.rmse),8)+f3(S.S.rmse),'',`|β₂|/σ = ${f2(a)}   |ρ|/(1−ρ²) = ${f2(b)}`,a>b?'long regression is more precise':'short regression is more precise');break}
  case 'ext':L.push(c('')+'long    short',c('slope')+col(f3(l.b[1]),8)+f3(short.b),c('SE, this sample')+col(f3(l.se[1]),8)+f3(short.se),c('SD, simulated')+col(f3(S.L.sd),8)+f3(S.S.sd),'',`Var(X̃₁) = ${f3(vT)}   VIF = ${f2(1/p.q)}`);break;
  }
  $('readout').textContent=L.join('\n');
}

/* ---------- render ---------- */
function render(){
  const k=st.step,step=steps[k],show=step.ctl;
  [...$('nav').querySelectorAll('button')].forEach((b,i)=>{b.classList.toggle('on',i===k);b.classList.toggle('done',i<k);b.setAttribute('aria-current',i===k?'step':'false')});
  $('stepnum').textContent=`Part ${step.part} · ${parts[step.part]} · Step ${k+1} of ${steps.length}`;
  $('stitle').textContent=step.t;
  $('stext').innerHTML=typeof katex!=='undefined'?tex(step.text):step.text.replace(/\\\(|\\\)/g,'');
  $('hint').textContent=step.hint;
  ['b1','b2','rho','n','seed','hold'].forEach(c=>{$('c-'+c).hidden=!show.includes(c)});
  ['mask','r0','r1'].forEach(c=>{$(c).hidden=!show.includes(c)});
  $('main').toggleAttribute('hidden',!!step.quad);$('quad').hidden=!step.quad;$('subp').hidden=!step.sub;
  $('sub').style.touchAction=['var','trade'].includes(step.id)?'none':'';$('sub').style.cursor=$('sub').style.touchAction?'grab':'';
  $('prev').disabled=k===0;$('next').disabled=k===steps.length-1;
  draw();
}
function draw(){const step=steps[st.step],D=sample(),S=step.sim?simulate():null;
  figure(step.id,D,S);readout(step.id,D,S);
  ['b1','b2','rho','n','seed'].forEach(c=>{$(c).value=st[c];$(c+'o').textContent=['n','seed'].includes(c)?st[c]:f2(st[c])});
  [...$('hold').querySelectorAll('button')].forEach(b=>b.classList.toggle('on',b.dataset.m===st.hold))}

/* nav */
let lastPart='';steps.forEach((s,i)=>{if(s.part!==lastPart){const p=document.createElement('span');p.className='part';p.textContent=parts[s.part];$('nav').appendChild(p);lastPart=s.part}
  const b=document.createElement('button');b.textContent=i+1;b.title=s.t;b.setAttribute('aria-label',`Step ${i+1}: ${s.t}`);b.onclick=()=>{st.step=i;render()};$('nav').appendChild(b)});
$('prev').onclick=()=>{if(st.step>0){st.step--;render()}};
$('next').onclick=()=>{if(st.step<steps.length-1){st.step++;render()}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
['b1','b2','rho','n','seed'].forEach(c=>$(c).addEventListener('input',()=>{st[c]=+$(c).value;draw()}));
[...$('hold').querySelectorAll('button')].forEach(b=>b.onclick=()=>{st.hold=b.dataset.m;draw()});
$('mask').onclick=()=>{st.b2=clamp(-st.b1*pars().d,-5,5);draw()};
$('r0').onclick=()=>{st.rho=0;st.hold='x1';draw()};
$('r1').onclick=()=>{st.rho=0.95;st.hold='x1';draw()};
$('reset').onclick=()=>{Object.assign(st,DEF);render()};

/* dragging and tooltips */
let drag=false;
const svgPt=(svg,e)=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
function pick(e){const s=$('sub'),q=svgPt(s,e),v=s._inv(q.x,q.y);
  if(steps[st.step].id==='var')st.rho=+clamp(v[0],-.95,.95).toFixed(2);
  else{st.rho=+(clamp(v[0],0,.95)*(st.rho<0?-1:1)).toFixed(2);st.b2=+(clamp(v[1],0,5)*(st.b2<0?-1:1)).toFixed(2)}
  draw()}
$('sub').addEventListener('pointerdown',e=>{if(['var','trade'].includes(steps[st.step].id)){drag=true;pick(e);e.preventDefault()}});
window.addEventListener('pointerup',()=>{drag=false});
window.addEventListener('pointermove',e=>{if(drag){pick(e);return}
  const t=e.target,tip=$('tip');let s=t.getAttribute&&t.getAttribute('data-tip');
  if(!s){const svg=t.closest&&t.closest('svg');if(svg&&svg._pts&&svg._pts.length){const q=svgPt(svg,e);let best=400;svg._pts.forEach(p=>{const d=(p[0]-q.x)**2+(p[1]-q.y)**2;if(d<best){best=d;s=p[2]}})}}
  tip.hidden=!s;if(s){tip.textContent=s;tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=Math.max(4,e.clientY-30)+'px'}});

render();
})();
</script>
