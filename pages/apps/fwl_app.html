<div class="wrap">
  <header>
    <h1>Frisch–Waugh–Lovell Theorem</h1>
    <p class="sub">What it means to control for a variable, built up one piece at a time. It picks up where <a href="regression-geometry.html">Regression Geometry</a> ends. Use the buttons or the ← → keys.</p>
  </header>
  <div class="topbar">
    <nav class="steps" id="nav" aria-label="Steps"></nav>
    <div class="pager"><button id="prev">← Previous</button><button id="next" class="primary">Next →</button></div>
  </div>
  <div class="grid" id="layout">
    <section class="panel">
      <div class="figs" id="fig"></div>
      <div class="legend" id="legend"></div>
      <p class="hint" id="hint"></p>
    </section>
    <section class="side">
      <div>
        <div class="stepnum" id="stepnum"></div>

      <div class="controls">
        <div class="ctl" id="c-b1"><label for="b1">β₁</label><input type="range" id="b1" min="0" max="4" step="0.1"><output id="b1o"></output></div>
        <div class="ctl" id="c-b2"><label for="b2">β₂</label><input type="range" id="b2" min="-4" max="4" step="0.01"><output id="b2o"></output></div>
        <div class="ctl" id="c-rho"><label for="rho">ρ</label><input type="range" id="rho" min="-0.95" max="0.95" step="0.01"><output id="rhoo"></output></div>
        <div class="ctl" id="c-ra"><label for="ra">ρ low</label><input type="range" id="ra" min="0" max="0.95" step="0.01"><output id="rao"></output></div>
        <div class="ctl" id="c-rb"><label for="rb">ρ high</label><input type="range" id="rb" min="0" max="0.95" step="0.01"><output id="rbo"></output></div>
        <div class="ctl" id="c-n"><label for="n">n</label><input type="range" id="n" min="20" max="500" step="10"><output id="no"></output></div>
        <div class="ctl" id="c-t"><label for="t">shift</label><input type="range" id="t" min="0" max="1" step="0.01"><output id="to"></output></div>
        <div class="ctl" id="c-push"><label for="push">outlier</label><input type="range" id="push" min="-5" max="5" step="0.1"><output id="pusho"></output></div>
        <div class="row" id="c-row">

<script>
(function(){
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
// Var(X₁) = Var(X₂) = Var(ε) = 1 throughout, so ρ is also the slope of X₁ on X₂
const LOW=0.3,HIGH=0.9,TOP=0.95;
const DEF={b1:2,b2:3,rho:0.7,ra:LOW,rb:HIGH,n:200,seed:1,t:0,push:0};
let st={step:0,...DEF};
const NSIM=500,NMAX=500;
const T=String.raw;

const steps=[
 {id:'map',part:'A',t:'Where we’re going',fig:[1,1,1],cols:3,wide:1,ctl:[],hint:'Darker dots have higher X₂. As ρ rises, they gather on the right.',
  text:T`<p>We want the effect of \(X_1\) on \(y\), but \(X_1\) moves together with a second variable, \(X_2\).</p><p class="key">The true effect is <strong>2 in all three panels</strong>, yet the fitted slope drifts away as the correlation \(\rho\) rises.</p><p>This walkthrough asks why that happens, how controlling for \(X_2\) fixes it, and what the fix costs.</p>`},
 {id:'one',part:'A',t:'One regressor',fig:[1],set:{b2:0,rho:0},ctl:['b1'],hint:'Move β₁. The fitted slope follows it.',
  text:T`<p>Start with the easy case. \(X_1\) is the only thing that moves \(y\), apart from noise:</p><p class="eq">\(y=\beta_1X_1+\varepsilon\)</p><p class="key">Regressing \(y\) on \(X_1\) <strong>recovers \(\beta_1\)</strong>, up to sampling noise.</p>`},
 {id:'add',part:'A',t:'Add a second variable',fig:[1],set:{rho:0},ctl:['b2'],hint:'Move β₂. The cloud gets thicker, but the slope stays near β₁.',
  text:T`<p>Now a second variable also moves \(y\), with effect \(\beta_2\):</p><p class="eq">\(y=\beta_1X_1+\beta_2X_2+\varepsilon\)</p><p>For now \(X_2\) is unrelated to \(X_1\). From the point of view of a regression on \(X_1\) alone, \(X_2\) is just more noise.</p><p class="key">The cloud thickens, but <strong>the slope is still right</strong>.</p>`},
 {id:'corr',part:'A',t:'Let them move together: omitted variable bias',fig:[1],ctl:['rho','b2'],hint:'Move ρ and β₂ and watch the red wedge. Set either one to zero and it closes.',
  text:T`<p>Now let \(X_1\) and \(X_2\) have correlation \(\rho\). When \(X_1\) is high, \(X_2\) tends to be high too, and that pushes \(y\) up by \(\beta_2\). The regression on \(X_1\) alone, the <strong>short regression</strong>, credits this to \(X_1\):</p><p class="eq">\(\text{short slope}=\beta_1+\beta_2\rho\)</p><p class="key">The red wedge is the <strong>omitted variable bias</strong>: the part of the slope that really belongs to \(X_2\).</p>`},
 {id:'need',part:'A',t:'The bias takes both β₂ and ρ',fig:[1,1,1,1],cols:2,wide:1,ctl:['b2','rho'],hint:'Each panel switches an ingredient on or off. The sliders set the non-zero values.',
  text:T`<p>With \(\beta_2=0\), \(X_2\) does nothing to \(y\), so there is nothing to pick up.</p><p>With \(\rho=0\), \(X_2\) moves \(y\) but is no more common at high \(X_1\) than at low \(X_1\). It adds noise, not bias.</p><p class="key">Only the outlined panel has <strong>both</strong> ingredients, and only it has a wedge: bias \(=\beta_2\rho\).</p>`},
 {id:'groups',part:'A',t:'Look within groups of X₂',fig:[1],set:{groups:1,n:300,seed:11},ctl:['rho','new'],hint:'Move ρ: the pooled line moves, the three group lines stay close to the true slope.',
  text:T`<p>To see what went wrong, let \(X_2\) take only three values: low, middle and high.</p><p>Within a group \(X_2\) does not change, so it cannot be behind any link between \(X_1\) and \(y\).</p><p class="key">Each group's own line has a slope <strong>close to the true \(\beta_1\)</strong>. The pooled line differs because it also runs <em>across</em> groups.</p><p><strong>Try it:</strong> set \(\rho\) to −0.9. The pooled slope turns negative while every group's slope stays positive. This reversal is <strong>Simpson's paradox</strong>. In the 1964 Civil Rights Act vote in the House, a larger share of Republicans than Democrats voted yes overall, yet a larger share of Democrats did within both North and South.</p>`},
 {id:'shift',part:'A',t:'Line the groups up',fig:[1],set:{groups:1,n:300,seed:11},ctl:['t'],hint:'Move shift from 0 to 100%. Rings mark each group’s centre.',
  text:T`<p>Holding \(X_2\) fixed means comparing only within groups. One way to do that with a single regression: subtract each group's mean from both \(X_1\) and \(y\).</p><p>Once the groups are lined up, the differences across them are gone, and the pooled slope becomes the within-group slope.</p><p class="key">That is the whole idea of the theorem: <strong>remove what \(X_2\) explains from both variables, then regress what is left</strong>.</p>`},
 {id:'px1',part:'B',t:'Partial X₂ out of X₁',fig:[1,1],ctl:['rho'],hint:'Red segments are a sample of the residuals. Both panels share the same axes.',
  text:T`<p>When \(X_2\) is continuous there are no groups to demean, so subtract the fitted line instead. Regress \(X_1\) on \(X_2\) and keep the residual:</p><p class="eq">\(\tilde X_1=M_2X_1\)</p><p>This is the residual maker from <a href="regression-geometry.html">Regression Geometry</a>, with \(X_2\) and an intercept as the regressors.</p><p class="key">\(\tilde X_1\) is <strong>the part of \(X_1\) that \(X_2\) cannot predict</strong>, so its slope on \(X_2\) is zero by construction.</p>`},
 {id:'py',part:'B',t:'Partial X₂ out of y',fig:[1,1],ctl:['rho','b2'],hint:'Red segments are a sample of the residuals. Both panels share the same axes.',
  text:T`<p>Do the same to the outcome: \(\tilde y=M_2y\). Applying \(M_2\) to the model removes \(X_2\), because \(M_2X_2=0\):</p><p class="eq">\(\tilde y=\beta_1\tilde X_1+M_2\varepsilon\)</p><p class="key">\(\tilde y\) and \(\tilde X_1\) are still linked by \(\beta_1\), <strong>now with \(X_2\) out of the way</strong>.</p>`},
 {id:'rr',part:'B',t:'Regress one residual on the other',fig:[1,1],cols:2,wide:1,ctl:['b2','rho','new'],hint:'Drag β₂ and ρ and compare the two lines.',
  text:T`<p>The right panel regresses \(\tilde y\) on \(\tilde X_1\). The left panel is the short regression, for comparison.</p><p class="key">Move \(\beta_2\) and \(\rho\). The left line swings, but <strong>the right line stays put</strong>. That stillness is the result: once \(X_2\) is partialled out, the slope no longer depends on it.</p><p>\(\beta_2\) has <strong>no effect at all</strong> on the right, because \(M_2\) removes \(X_2\) exactly. \(\rho\) only moves it a little, through noise.</p><p>The right slope is also <strong>exactly</strong> the coefficient on \(X_1\) in the long regression of \(y\) on \(X_1\) and \(X_2\), in every sample. That is the Frisch–Waugh–Lovell theorem.</p>`},
 {id:'onlyx',part:'B',t:'Residualise only X₁',fig:[1,1],cols:2,wide:1,ctl:['rho'],hint:'Same slope in both panels. Compare how far the dots sit from the line.',
  text:T`<p>Does \(y\) need cleaning too? For the slope, no. Regressing \(y\) itself on \(\tilde X_1\) gives the same number, because the part of \(y\) that \(X_2\) explains is orthogonal to \(\tilde X_1\).</p><p class="key"><strong>Same slope, wrong standard error.</strong> The part of \(y\) that \(X_2\) explains stays in the residual, so the dots sit further from the line.</p>`},
 {id:'onlyy',part:'B',t:'Residualise only y',fig:[1,1],cols:2,wide:1,ctl:['rho'],hint:'Move ρ: the left slope falls further below the true one.',
  text:T`<p>Now clean \(y\) but leave \(X_1\) alone. \(X_1\) still contains the part that moves with \(X_2\), and that part is now unrelated to \(\tilde y\). It only stretches the horizontal axis, which flattens the line:</p><p class="eq">\(\text{slope}=\hat\beta_1\,\text{Var}(\tilde X_1)/\text{Var}(X_1)\)</p><p class="key"><strong>This slope is wrong.</strong> \(X_1\) is the side that must be residualised.</p>`},
 {id:'thm',part:'B',t:'The theorem',fig:[1,1,1,1],cols:2,wide:1,ctl:['b1','b2','rho','new'],hint:'All four panels share the same axes. Each caption gives the residual SD.',
  text:T`<p>Every regression here has an intercept. Three routes give the same \(\hat\beta_1\):</p><ol><li>The long regression: \(\hat\beta=(X'X)^{-1}X'y\), where \(\hat\beta_1\) is the entry for \(X_1\).</li><li>Residual on residual: \(\hat\beta_1=(\tilde X_1'\tilde X_1)^{-1}\tilde X_1'\tilde y\).</li><li>\(y\) on the residual: \(\hat\beta_1=(\tilde X_1'\tilde X_1)^{-1}\tilde X_1'y\).</li></ol><p>Routes 2 and 3 agree because \(M_2\) is symmetric and \(M_2M_2=M_2\), so \(\tilde X_1'\tilde y=X_1'M_2y=\tilde X_1'y\).</p><p class="key"><strong>The outlined panel has the least residual variance.</strong> With \(X_2\) gone from both axes, only the noise \(\varepsilon\) is left, so its residual SD is close to \(\sigma=1\).</p>`},
 {id:'low',part:'C',t:'Low correlation: X̃₁ keeps most of X₁',fig:[1,1],set:{rho:LOW},ctl:['rho'],hint:'Starts at ρ = 0.3. Move ρ to see the orange dots and the orange bar react.',
  text:T`<p>The grey dots are \(X_1\). The purple line is what \(X_2\) predicts. The orange dots are \(\tilde X_1\): the same observations with that line subtracted.</p><p><strong>The bars on the right</strong> show each variable's span: from two standard deviations below its mean to two above, which covers about 95% of the dots.</p><p><strong>The histogram</strong> shows the same two variables as counts. Each bar is the number of the 200 observations with a value in that range. A narrower histogram means less variation.</p><p class="key">At \(\rho=0.3\) the line is almost flat, so subtracting it changes little: <strong>the two spans nearly match</strong>.</p>`},
 {id:'high',part:'C',t:'High correlation: X̃₁ keeps little',fig:[1,1],set:{rho:HIGH},ctl:['rho'],hint:'Starts at ρ = 0.9, on the same axes as the previous slide.',
  text:T`<p>At \(\rho=0.9\) the line is steep, because \(X_2\) predicts most of \(X_1\). Subtracting it collapses the dots into a narrow band.</p><p class="key">\(X_1\) itself spans just as wide as before. <strong>What is left over, \(\tilde X_1\), spans far less</strong>, and its histogram is much narrower.</p>`},
 {id:'both',part:'C',t:'Low and high together',fig:[1,1,1,1,2],cols:2,wide:1,ctl:['ra','rb'],hint:'Top: dots. Middle: histograms. Bottom: the rule behind both. Move either ρ.',
  text:T`<p>The two cases are one rule. Residualising removes the share of \(X_1\)'s variance that \(X_2\) explains, and that share is \(\rho^2\):</p><p class="eq">\(\text{Var}(\tilde X_1)=(1-\rho^2)\,\text{Var}(X_1)\)</p><p>The bottom panel plots the share left over for every \(\rho\), with your two values marked.</p><p class="key">Modest correlation costs little: \(\rho=0.3\) removes 9% of the variance. <strong>The cost accelerates near 1</strong>: \(\rho=0.9\) removes 81%.</p>`},
 {id:'beta',part:'C',t:'What the βs change',fig:[1,1],cols:2,wide:1,ctl:['b1','b2','rho','mask'],hint:'Move β₁ and β₂: the left panel never changes. Then press the button.',
  text:T`<p class="key">\(\tilde X_1\) is built without looking at \(y\), so <strong>\(\beta_1\) and \(\beta_2\) cannot change it</strong>. Only \(\rho\) moves the left panel.</p><p>They do decide how much partialling out takes from \(y\). The line through \(y\) has slope \(\beta_2+\beta_1\rho\): \(X_2\)'s direct effect, plus its effect through \(X_1\). The steeper that line, the more \(y\) shrinks.</p><p>If the two channels cancel, the line is flat and \(y\) loses nothing. \(X_1\) still shrinks, and the short regression is still biased.</p>`},
 {id:'fanlo',part:'D',t:'Low correlation: a wide base',fig:[1,1],set:{rho:LOW,n:60},ctl:['rho','n','new'],hint:'Both axes use the same scale, so the shape of the cloud is real. New sample redraws the dots and moves the red line.',
  text:T`<p>\(\hat\beta_1\) is the slope through the \(\tilde X_1\) cloud, so only \(\tilde X_1\)'s variation identifies it. To see how reliable it is, repeat the whole exercise.</p><p><strong>Draw a fresh sample, run the regression, note the slope. Do that 500 times.</strong></p><p>The thin lines in the top panel are 40 of those fits. The histogram is all 500 estimated slopes: each bar counts the samples whose slope fell in that range. The red line marks the sample shown in the dots.</p><p class="key">At \(\rho=0.3\) the cloud is wide. A line on a wide base is hard to tilt, so <strong>the slopes bunch tightly</strong>.</p>`},
 {id:'fanhi',part:'D',t:'High correlation: a nearly vertical cloud',fig:[1,1],set:{rho:HIGH,n:60},ctl:['rho','n','new'],hint:'Same axes as the previous slide, equal scale on both. The thin lines fan out much further.',
  text:T`<p>At \(\rho=0.9\) the \(\tilde X_1\) cloud is narrow, almost vertical. The line now rests on a narrow base, so small movements in a few dots tilt it a lot.</p><p class="key">The slopes are still centred on the truth, but <strong>they spread about twice as wide</strong>.</p><p>The fan of lines is the uncertainty the shaded 95% confidence band estimates from a single sample.</p>`},
 {id:'push',part:'D',t:'Side by side: add one outlier',fig:[1,1,1,1],cols:2,wide:1,set:{ra:0,rb:TOP,n:30,push:4},ctl:['push','ra','rb','new'],hint:'Move the outlier slider. The same observation shifts by the same amount in both panels.',
  text:T`<p>Turn one observation into an <strong>outlier</strong>: take the point furthest from the centre and shift it up or down by the same amount in both panels. The dashed line is the fit without the outlier, and the red wedge is how far it moved the line.</p><p class="key">With \(\rho=0.95\), <strong>the same outlier moves the slope about three times as far</strong>. With so little \(\tilde X_1\) variation, every observation carries more weight.</p><p>The histograms show this slope among 500 samples, on the same axis. Across samples this gives</p><p class="eq">\(\text{Var}(\hat\beta_1)\approx\dfrac{\sigma^2}{n\,\text{Var}(\tilde X_1)}=\dfrac{\sigma^2}{n}\cdot\dfrac{1}{1-\rho^2}\)</p><p>The last factor is the <strong>variance inflation factor</strong>.</p>`},
 {id:'lz',part:'D',t:'Long against short: no correlation',fig:[1,1,2],cols:2,wide:1,set:{rho:0},ctl:['rho','b2'],hint:'Starts at ρ = 0. The histogram collects the slopes from 500 samples.',
  text:T`<p>Controlling also has a benefit. Compare the two regressions when \(X_2\) is unrelated to \(X_1\) but still moves \(y\).</p><p>Both are centred on the truth, since there is no bias to fix. The short regression leaves \(X_2\) in its error, so its cloud is thick. The long regression removes it and loses nothing, because \(\tilde X_1\) is essentially \(X_1\).</p><p class="key">Here controlling is free: <strong>the long regression is simply more precise</strong>.</p>`},
 {id:'lh',part:'D',t:'Long against short: high correlation',fig:[1,1,2],cols:2,wide:1,set:{rho:TOP},ctl:['rho','b2'],hint:'Starts at ρ = 0.95. The histogram collects the slopes from 500 samples.',
  text:T`<p>At high correlation the picture reverses. The short regression has plenty of variation in \(X_1\), so its slope is tight, around the wrong value.</p><p>The long regression is centred on the truth, but it has only a sliver of \(\tilde X_1\) to work with, so it is noisier than the short regression.</p><p class="key"><strong>Short: tighter, but wrong. Long: right, but noisier.</strong></p>`},
 {id:'lboth',part:'D',t:'Long against short, together',fig:[1,1,1,1],cols:2,wide:1,set:{ra:0,rb:TOP},ctl:['ra','rb','b2'],hint:'All panels use the same axes. Move β₂ towards zero and watch the short regression.',
  text:T`<p>The control does two things. It takes \(X_2\) out of the error, which helps more the larger \(|\beta_2|\) is. It also takes variation out of the regressor, which hurts more the larger \(|\rho|\) is.</p><p class="key">On variance alone, the long regression wins when \(|\beta_2|/\sigma>|\rho|/(1-\rho^2)\). <strong>But variance ignores where the distribution is centred.</strong></p>`},

  text:T`<p>Each regression can miss the truth in two ways. It can be centred in the wrong place, which is <strong>bias</strong>, or it can scatter widely, which is <strong>variance</strong>.</p><p>Mean squared error adds the two. It is the average squared distance of the estimates from the true value:</p><p class="eq">\(\text{MSE}=\text{bias}^2+\text{variance}\)</p><p class="key">The long regression scores on variance only. <strong>The short regression has less variance here, but pays for its bias.</strong></p>`},
 {id:'mse',part:'D',t:'When is it worth controlling?',fig:[1],set:{rho:0.7,b2:0.1,n:100},ctl:['b2','rho','n'],hint:'Move n: more data shrinks variance but not bias, so the crossing moves left.',
  text:T`<p>The chart scores both regressions for every \(|\beta_2|\). The long regression has no bias, so its MSE is flat. The short regression's MSE adds the shaded bias term, \((\beta_2\rho)^2\), to its variance.</p><p>Left of the crossing the short regression wins. Right of it the long regression wins.</p><p class="key"><strong>The short regression only wins while \(|\beta_2|\) is small</strong>, and that window closes as \(n\) grows. Unless \(X_2\) barely matters, control for it.</p>`}

  const cid='clip-'+s.id,cp=el('clipPath',{id:cid},el('defs',{},s));el('rect',{x:pl,y:pt,width:Wd-pl-pr_,height:Hd-pt-pb},cp);

function lsHist(s,S,xr,o={}){return hist(s,[{v:S.S.v,c:'var(--res)',name:'Short'},{v:S.L.v,c:'var(--fit)',name:'Long'}],{xr,bins:o.bins||60,xl:'estimated slope β̂₁',ymax:o.ymax,H:o.H||190,W:o.W,v:[{x:st.b1,c:'var(--fg)',t:'true β₁'},...(o.v||[])]})}
function pairStep(){const r=st.rho,D=mk(),fS=fit(D.X1,D.y),fL=fit(D.tX1,D.tY),S=simulate(),pad=Math.max(.8,4*Math.max(S.L.sd,S.S.sd)),lo=Math.min(st.b1,S.S.m)-pad,hi=Math.max(st.b1,S.S.m)+pad;
  cap(0,`Short regression: y on X₁ · ρ = ${f2(r)}`);cap(1,'Long regression: ỹ on X̃₁');cap(2,'Histogram: estimated slope in each of 500 simulated samples');
  scatter(P[0],[{x:D.X1,y:D.y}],{xr:XR,yr:YR,xl:'X₁',yl:'y',W:300,H:270,lines:both(fS,'var(--res)')});
  scatter(P[1],[{x:D.tX1,y:D.tY}],{xr:XR,yr:YR,xl:'X̃₁',yl:'ỹ',W:300,H:270,lines:both(fL)});
  lsHist(P[2],S,[lo,hi],{W:wideW(),H:190,bins:64});legend(LS)}

    overlay(P[0],D,{yr:XR,yl:'X₁ and X̃₁',H:290});xhist(P[1],D);legend([['dot','var(--muted)','X₁'],['dot','var(--x)','X̃₁'],['line','var(--fit)','What X₂ predicts']]);break;
  case 'both':{[st.ra,st.rb].forEach((r,i)=>{const d=mk({rho:r});cap(i,`ρ = ${f2(r)}: X₁ and X̃₁ against X₂`);cap(i+2,`ρ = ${f2(r)}: histogram`);
      overlay(P[i],d,{yr:XR,yl:'X₁, X̃₁',W:320,H:240});xhist(P[i+2],d,{W:320,H:150})});
    cap(4,'Share of X₁’s variance left in X̃₁, for every ρ');
    const Wd=wideW(),Hd=170,[sx,sy,g]=frame(P[4],[0,1],[0,1],'ρ','share left',Wd,Hd,{ky:2,fy:pct}),rs=Array.from({length:61},(_,i)=>i/60),pts=rs.map(r=>sx(r).toFixed(1)+','+sy(1-r*r).toFixed(1));

    [st.ra,st.rb].forEach(v=>{const r=Math.abs(v),q=1-r*r,left=r<.25;marker(P[4],sx(r),sy(q),'var(--x)',5);curveLabel(P[4],sx(r)+(left?8:-8),sy(q)+18,`ρ = ${f2(v)}: ${pct(q)} left`,left?'start':'end')});

    legend([['dot','var(--muted)','Before partialling out'],['dot','var(--x)','X̃₁'],['dot','var(--y)','ỹ'],['line','var(--fit)','What X₂ predicts']]);break;
  case 'fanlo':case 'fanhi':{const S=simulate(),f=fit(D.tX1,D.tY);cap(0,`ρ = ${f2(st.rho)}: ỹ on X̃₁, with the fits from 40 of the 500 samples`);cap(1,'Histogram: the estimated slope from each of 500 samples');
    scatter(P[0],[{x:D.tX1,y:D.tY,op:.6}],{xr:EQ,yr:EQ,xl:'X̃₁',yl:'ỹ',H:426,band:id==='fanhi'?f:null,fan:fan(S),lines:[{a:0,b:st.b1,c:'var(--fg)',dash:'5 4'}]});
    slopeHist(P[1],S,{v:[{x:st.b1,c:'var(--fg)',t:'true β₁'},{x:f.b,c:'var(--res)',dash:'none',t:'this sample',row:1}]});legend([OBS,['line','var(--fit)','Fit from one sample'],...(id==='fanhi'?[CI]:[]),TRUE]);break}
  case 'push':[st.ra,st.rb].forEach((r,i)=>{const d=mk({rho:r}),S=simulate({rho:r}),k=topIdx(d),base=fit(d.tX1,d.tY),y=d.tY.map((v,j)=>j===k?v+st.push:v),f=fit(d.tX1,y);
      cap(i,`ρ = ${f2(r)}: slope moved by ${f2(Math.abs(f.b-base.b))}`);cap(i+2,`ρ = ${f2(r)}: this slope among 500 samples`);
      scatter(P[i],[{x:d.tX1,y}],{xr:EQ6,yr:EQ6,xl:'X̃₁',yl:'ỹ',W:320,H:306,r:3,hot:[[d.tX1[k],y[k]]],gap:{L:base,F:f},lines:[{a:base.a,b:base.b,c:'var(--muted)',dash:'4 3'},{a:f.a,b:f.b,c:'var(--fit)'}]});

    [st.ra,st.rb].forEach((r,i)=>{const d=mk({rho:r}),f=fit(d.tX1,d.tY);cap(i,`ρ = ${f2(r)}: ỹ on X̃₁`);cap(i+2,`ρ = ${f2(r)}: slopes in 500 samples`);
      scatter(P[i],[{x:d.tX1,y:d.tY}],{xr:XR,yr:YR,xl:'X̃₁',yl:'ỹ',W:320,H:230,lines:[{...trueLine(f),lab:null},{...fitLine(f),lab:null}]});

const topIdx=D=>D.tX1.reduce((k,v,i,a)=>Math.abs(v)>Math.abs(a[k])?i:k,0);
// Widest β₂ worth drawing: where the short MSE reaches three times the long MSE
const b2max=()=>{const q=1-st.rho*st.rho;return clamp(Math.sqrt((3/q-1)/(q+st.n*st.rho*st.rho)),.1,1.5)};

/* ---------- readout ---------- */
function readout(id){const L=[],D=mk(),c=(a,w=18)=>col(a,w),short=fit(D.X1,D.y);
  const tb=(rows)=>rows.map(r=>c(r[0])+col(r[1],9)+(r[2]??''));
  const scoreRows=()=>{const t=theory(),S=simulate();return[c('')+col('long',9)+'short',...tb([['bias²','0',f3(t.bias**2)],['variance',f3(t.vL),f3(t.vS)],['MSE',f3(t.mL),f3(t.mS)],['MSE, simulated',f3(S.L.mse),f3(S.S.mse)]])]};
  switch(id){
  case 'one':case 'add':L.push(c('true β₁')+f3(st.b1),c('fitted slope')+f3(short.b));break;
  case 'corr':L.push(c('true β₁')+f3(st.b1),c('short slope')+f3(short.b),c('bias, this sample')+f3(short.b-st.b1),c('bias, expected')+f3(st.b2*st.rho)+'  = β₂ρ');break;
  case 'need':L.push(c('β₂ off, ρ off')+'0.00',c('β₂ on,  ρ off')+'0.00',c('β₂ off, ρ on')+'0.00',c('β₂ on,  ρ on')+f2(st.b2*st.rho));break;
  case 'groups':{const G=['low X₂','middle X₂','high X₂'].map((nm,k)=>{const I=D.g.map((v,i)=>v===k?i:-1).filter(i=>i>=0);return c(nm)+f3(fit(I.map(i=>D.X1[i]),I.map(i=>D.y[i])).b)});L.push(...G,c('pooled')+f3(short.b),c('true β₁')+f3(st.b1));break}
  case 'shift':{const M=[0,1,2].map(k=>{const I=D.g.map((v,i)=>v===k?i:-1).filter(i=>i>=0);return[mean(I.map(i=>D.X1[i])),mean(I.map(i=>D.y[i]))]}),f=fit(D.X1.map((v,i)=>v-st.t*M[D.g[i]][0]),D.y.map((v,i)=>v-st.t*M[D.g[i]][1]));L.push(c('shift')+pct(st.t),c('pooled slope')+f3(f.b),c('true β₁')+f3(st.b1));break}
  case 'px1':L.push(c('slope of X₁ on X₂')+f3(fit(D.X2,D.X1).b),c('slope of X̃₁ on X₂')+f3(fit(D.X2,D.tX1).b));break;
  case 'py':L.push(c('slope of y on X₂')+f3(fit(D.X2,D.y).b),c('slope of ỹ on X₂')+f3(fit(D.X2,D.tY).b));break;
  case 'rr':L.push(c('short slope',20)+f3(short.b)+'  swings',c('ỹ on X̃₁',20)+f3(fit(D.tX1,D.tY).b)+'  stays put',c('long regression',20)+f3(long(D).b[1])+'  identical',c('true β₁',20)+f3(st.b1));break;
  case 'onlyx':{const a=fit(D.tX1,D.y),b=fit(D.tX1,D.tY),l=long(D);L.push(c('')+col('slope',9)+'SE',...tb([['y on X̃₁',f3(a.b),f3(a.se)],['ỹ on X̃₁',f3(b.b),f3(b.se)],['long regression',f3(l.b[1]),f3(l.se[1])]]));break}
  case 'onlyy':{const b=fit(D.tX1,D.tY).b,r=varr(D.tX1)/varr(D.X1);L.push(c('ỹ on X₁',22)+f3(fit(D.X1,D.tY).b),c('β̂₁ × '+f3(r),22)+f3(b*r),c('where Var(X̃₁)/Var(X₁)',22)+' = '+f3(r));break}
  case 'thm':{const R=[['y on X₁',short],['ỹ on X₁',fit(D.X1,D.tY)],['y on X̃₁',fit(D.tX1,D.y)],['ỹ on X̃₁',fit(D.tX1,D.tY)]];L.push(c('')+col('slope',9)+'residual SD',...tb(R.map(([n,f])=>[n,f3(f.b),f2(resSD(f))])),c('long regression')+f3(long(D).b[1]),c('true β₁')+f3(st.b1));break}
  case 'low':case 'high':L.push(c('Var(X₁)')+f2(varr(D.X1)),c('Var(X̃₁)')+f2(varr(D.tX1)),c('share left')+pct(varr(D.tX1)/varr(D.X1)));break;
  case 'both':{const a=mk({rho:st.ra}),b=mk({rho:st.rb});L.push(c('')+col('ρ = '+f2(st.ra),11)+'ρ = '+f2(st.rb),...[['Var(X₁)',f2(varr(a.X1)),f2(varr(b.X1))],['Var(X̃₁)',f2(varr(a.tX1)),f2(varr(b.tX1))],['share left',pct(varr(a.tX1)/varr(a.X1)),pct(varr(b.tX1)/varr(b.X1))]].map(r=>c(r[0])+col(r[1],11)+r[2]));break}
  case 'beta':{const tot=st.b2+st.b1*st.rho;L.push(c('slope β₂ + β₁ρ',22)+f2(tot),c('Var(y) → Var(ỹ)',22)+f2(varr(D.y))+' → '+f2(varr(D.tY)),c('Var(X₁) → Var(X̃₁)',22)+f2(varr(D.X1))+' → '+f2(varr(D.tX1)));break}
  case 'fanlo':case 'fanhi':{const S=simulate();L.push(c('Var(X̃₁)',21)+f2(varr(D.tX1)),c('this sample’s slope',21)+f3(fit(D.tX1,D.tY).b),c('mean of 500 slopes',21)+f3(S.L.m),c('SD of 500 slopes',21)+f3(S.L.sd));break}
  case 'push':{const a=mk({rho:st.ra}),b=mk({rho:st.rb}),mv=d=>{const k=topIdx(d),y=d.tY.map((v,j)=>j===k?v+st.push:v);return fit(d.tX1,y).b-fit(d.tX1,d.tY).b},ma=mv(a),mb=mv(b),A=simulate({rho:st.ra}),B=simulate({rho:st.rb}),w=11;
    L.push(c('')+col('ρ = '+f2(st.ra),w)+'ρ = '+f2(st.rb),...[['slope moved by',f3(ma),f3(mb)],['SD across samples',f3(A.L.sd),f3(B.L.sd)],['VIF, 1/(1 − ρ²)',f2(1/(1-st.ra**2)),f2(1/(1-st.rb**2))]].map(r=>c(r[0])+col(r[1],w)+r[2]));if(Math.abs(ma)>1e-3)L.push('',`moved ${(mb/ma).toFixed(1)} times as far`);break}
  case 'lz':case 'lh':{const S=simulate();L.push(c('')+col('long',9)+'short',...tb([['mean of slope',f3(S.L.m),f3(S.S.m)],['SD of slope',f3(S.L.sd),f3(S.S.sd)]]));break}
  case 'lboth':{const A=simulate({rho:st.ra}),B=simulate({rho:st.rb});L.push(c('',16)+col('long',8)+'short',...[[`ρ = ${f2(st.ra)}`,A],[`ρ = ${f2(st.rb)}`,B]].flatMap(([nm,S])=>[c(nm+' mean',16)+col(f2(S.L.m),8)+f2(S.S.m),c(nm+' SD',16)+col(f2(S.L.sd),8)+f2(S.S.sd)]));break}
  case 'bv':{const t=theory();L.push(...scoreRows(),'',t.mL<t.mS?'smaller MSE: long regression':'smaller MSE: short regression');break}
  case 'mse':{const t=theory(),q=t.q,cross=Math.sqrt(st.rho*st.rho/(q*(q+st.n*st.rho*st.rho)));L.push(t.mL<t.mS?'smaller MSE here: long regression':'smaller MSE here: short regression',`curves cross at |β₂| = ${f2(cross)}`,'',...scoreRows());break}
  }
  $('readout').textContent=L.join('\n');
}

/* ---------- render ---------- */
const SL=['b1','b2','rho','ra','rb','n','t','push'];
function go(k){st={...DEF,...steps[k].set,step:k};const step=steps[k],f=$('fig');
  f.innerHTML='';f.style.setProperty('--cols',step.cols||1);$('layout').classList.toggle('wide',!!step.wide);
  P=step.fig.map((c,i)=>{const d=document.createElement('div'),l=document.createElement('div'),s=document.createElementNS(NS,'svg');d.className='cell';l.className='plabel';s.id='p'+i;s.setAttribute('role','img');
    if(c===2)d.style.gridColumn='1/-1';d.append(l,s);f.append(d);return s});
  const score=['bv','mse'].includes(step.id);
  $('b2').min=score?0:-4;$('b2').max=step.id==='bv'?2:step.id==='mse'?1.5:4;
  $('rho').min=score?0:-.95;
    render();
}
function render(){
  const k=st.step,step=steps[k],show=step.ctl;
  [...$('nav').querySelectorAll('button')].forEach((b,i)=>{b.classList.toggle('on',i===k);b.classList.toggle('done',i<k);b.setAttribute('aria-current',i===k?'step':'false')});
  $('stepnum').textContent=`Part ${step.part} · ${parts[step.part]} · Step ${k+1} of ${steps.length}`;
  $('stitle').textContent=step.t;
  $('stext').innerHTML=typeof katex!=='undefined'?tex(step.text):step.text.replace(/\\\(|\\\)/g,'');
  $('hint').textContent=step.hint;
  SL.forEach(c=>{$('c-'+c).hidden=!show.includes(c)});
  $('mask').hidden=!show.includes('mask');$('new').hidden=!show.includes('new');
  $('reset').hidden=!show.length;$('c-row').hidden=!show.length;
  $('prev').disabled=k===0;$('next').disabled=k===steps.length-1;
  draw();
}
function draw(){const id=steps[st.step].id;
  if(id==='mse'){const m=b2max();$('b2').max=m;st.b2=Math.min(st.b2,m)}
  figure(id);readout(id);
  SL.forEach(c=>{$(c).value=st[c];$(c+'o').textContent=c==='n'?st.n:c==='t'?pct(st.t):f2(st[c])})}

/* nav */
let lastPart='';steps.forEach((s,i)=>{if(s.part!==lastPart){const p=document.createElement('span');p.className='part';p.textContent=parts[s.part];$('nav').appendChild(p);lastPart=s.part}
  const b=document.createElement('button');b.textContent=i+1;b.title=s.t;b.setAttribute('aria-label',`Step ${i+1}: ${s.t}`);b.onclick=()=>go(i);$('nav').appendChild(b)});
$('prev').onclick=()=>{if(st.step>0)go(st.step-1)};
$('next').onclick=()=>{if(st.step<steps.length-1)go(st.step+1)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
SL.forEach(c=>$(c).addEventListener('input',()=>{st[c]=+$(c).value;draw()}));
$('mask').onclick=()=>{st.b2=clamp(-st.b1*st.rho,-4,4);draw()};
$('new').onclick=()=>{st.seed=st.seed%100+1;draw()};
$('reset').onclick=()=>go(st.step);

/* tooltips */
const svgPt=(svg,e)=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
window.addEventListener('pointermove',e=>{const t=e.target,tip=$('tip');let s=null;
  const svg=t.closest&&t.closest('svg');if(svg&&svg._pts&&svg._pts.length){const q=svgPt(svg,e);let best=400;svg._pts.forEach(p=>{const d=(p[0]-q.x)**2+(p[1]-q.y)**2;if(d<best){best=d;s=p[2]}})}
  tip.hidden=!s;if(s){tip.textContent=s;tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=Math.max(4,e.clientY-30)+'px'}});

go(0);
})();
</script>
