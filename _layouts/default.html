<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    {% if site.goatcounter and jekyll.environment == 'production' %}
    <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    {% endif %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.description }}" href="/feed.xml">
